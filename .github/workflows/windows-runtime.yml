name: Windows Runtime CI

# Runtime validation of the officeDeploy.bat control flow on real
# GitHub-hosted Windows cmd.exe. This is a safety / contract test:
#   - no ODT download
#   - no Office installation
#   - no activation
# Interactive tests use Exit-only paths or instrument a copied bat to stop
# before ODT/activation. T9 / T10 are terminated deterministically inside
# :ensure_odt before any network call by using the script's own stale-
# temporary-cleanup branch as a fault-injection point.
# T12 is the only test that enters the interactive option [2] path. It
# instruments a COPIED bat at runtime (there is NO test seam in the
# production script) so the Ohook call becomes unreachable, then drives the
# read-only :oh_check_supported_office detector against mocked registry +
# marker-file + ClickToRun service fixtures. No activation ever runs.
# T13 drives :oh_activate_core directly (no Office on the runner) to prove
# the fail-fast guard aborts before the mutating cleanup routines. Its copied
# script stubs the licensing-health preflight; T17 separately locks the real
# production ordering, T18/T18c exercise provider and C2R readiness semantics,
# and T20 drives the copied activation core to prove readiness failure is
# fail-closed before any product/key/hook/cleanup path.
# T21 directly exercises the read-only installation-preflight classifier;
# T22 drives the real interactive option [1] menus with copied-script detector
# fixtures and stops before ODT/network/install.
# T23 statically locks the MAS 3.12 synchronization and local integration
# order. T24 calls only :oh_extractdll in an instrumented copy and validates
# the two temporary PE outputs; it never enters activation or cleanup.
# T14 / T15 / T15b guard the line-ending contract of the distributed artifact.
# T14 extracts the raw Git blob of officeDeploy.bat (exactly what an end user
# downloads) and asserts, byte-for-byte, that every line ending is CRLF.
# T15 runs that same blob via `call` and asserts a clean config-only run
# (exit 0, valid Configuration.xml, no setup.exe/tmp, SUCCESS in log). T15b
# then scans the blob's own output for any batch-control-flow-break signature
# (English + Chinese) -- in PowerShell, because zh strings are unreliable in a
# cmd script. Together they lock the CRLF requirement that .gitattributes
# `-text` enforces at storage time.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No path filtering: this workflow is expected to become a required
# check, and path/branch filters on a required workflow can leave it
# stuck Pending. Letting it always run keeps the cost tiny.
permissions:
  contents: read

concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: Runtime contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ----------------------------------------------------------------------
      # T1 / T2 / T3 share the same isolated case directory and only differ
      # by arguments + expected exit code, so a single cmd step runs them.
      # ----------------------------------------------------------------------
      - name: T1 Help / T2 Unknown arg / T3 illegal config-only
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\cli" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\cli\officeDeploy.bat" >nul

          :: Per-case TEMP/TMP isolation so logs cannot collide.
          mkdir "%ROOT%\cli\temp" >nul 2>nul
          set "TEMP=%ROOT%\cli\temp"
          set "TMP=%ROOT%\cli\temp"

          :: ---- T1: --help must exit 0 ----
          call "%ROOT%\cli\officeDeploy.bat" --help > "%ROOT%\cli\t1.out" 2>&1
          set "RC1=!ERRORLEVEL!"
          if not "!RC1!"=="0" (
            echo [T1] FAIL: expected exit 0, got !RC1!
            type "%ROOT%\cli\t1.out"
            exit /b 1
          )
          findstr /c:"officeDeploy.bat --unattended" "%ROOT%\cli\t1.out" >nul || ( echo [T1] FAIL: usage missing --unattended & exit /b 1 )
          findstr /c:"officeDeploy.bat --unattended --config-only" "%ROOT%\cli\t1.out" >nul || ( echo [T1] FAIL: usage missing --config-only & exit /b 1 )
          findstr /c:"officeDeploy.bat --help" "%ROOT%\cli\t1.out" >nul || ( echo [T1] FAIL: usage missing --help & exit /b 1 )
          if exist "%ROOT%\cli\Configuration.xml" ( echo [T1] FAIL: Configuration.xml leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe" ( echo [T1] FAIL: setup.exe leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe.download.tmp" ( echo [T1] FAIL: tmp leaked & exit /b 1 )
          echo [T1] PASS help-exit=0

          :: ---- T2: --unknown must exit 2 ----
          call "%ROOT%\cli\officeDeploy.bat" --unknown > "%ROOT%\cli\t2.out" 2>&1
          set "RC2=!ERRORLEVEL!"
          if not "!RC2!"=="2" ( echo [T2] FAIL: expected 2, got !RC2! & exit /b 1 )
          if exist "%ROOT%\cli\Configuration.xml" ( echo [T2] FAIL: Configuration.xml leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe" ( echo [T2] FAIL: setup.exe leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe.download.tmp" ( echo [T2] FAIL: tmp leaked & exit /b 1 )
          echo [T2] PASS unknown-exit=2

          :: ---- T3: --config-only alone must exit 2 ----
          call "%ROOT%\cli\officeDeploy.bat" --config-only > "%ROOT%\cli\t3.out" 2>&1
          set "RC3=!ERRORLEVEL!"
          if not "!RC3!"=="2" ( echo [T3] FAIL: expected 2, got !RC3! & exit /b 1 )
          if exist "%ROOT%\cli\Configuration.xml" ( echo [T3] FAIL: Configuration.xml leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe" ( echo [T3] FAIL: setup.exe leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe.download.tmp" ( echo [T3] FAIL: tmp leaked & exit /b 1 )
          echo [T3] PASS config-only-alone-exit=2

          exit /b 0

      # ----------------------------------------------------------------------
      # T4 / T4b / T6: real --unattended --config-only must exit 0, produce a
      # non-empty Configuration.xml, leave no setup.exe / tmp, and write an
      # unattended log with the required key markers. T4b re-runs the same
      # case with arguments in reverse order to exercise two consecutive
      # shift /1 in :parse_args and confirm the loop-style parser is order
      # independent. T6 also pins the %0 root-cause fix (SCRIPT_PATH reads
      # %~f0 directly and must not be corrupted).
      # ----------------------------------------------------------------------
      - name: T4 T4b config-only / T6 unattended log
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\config-only" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\config-only\officeDeploy.bat" >nul
          mkdir "%ROOT%\config-only\temp" >nul 2>nul
          set "TEMP=%ROOT%\config-only\temp"
          set "TMP=%ROOT%\config-only\temp"

          call "%ROOT%\config-only\officeDeploy.bat" --unattended --config-only > "%ROOT%\config-only\run.out" 2>&1
          set "RC=!ERRORLEVEL!"

          if not "!RC!"=="0" ( echo [T4] FAIL: expected 0, got !RC! & exit /b 1 )
          if not exist "%ROOT%\config-only\Configuration.xml" ( echo [T4] FAIL: Configuration.xml missing & exit /b 1 )
          for %%A in ("%ROOT%\config-only\Configuration.xml") do set "SZ=%%~zA"
          if !SZ! LEQ 0 ( echo [T4] FAIL: Configuration.xml empty & exit /b 1 )
          if exist "%ROOT%\config-only\setup.exe" ( echo [T4] FAIL: setup.exe should not exist in config-only & exit /b 1 )
          if exist "%ROOT%\config-only\setup.exe.download.tmp" ( echo [T4] FAIL: tmp should not exist in config-only & exit /b 1 )
          echo [T4] PASS config-only-exit=0 xml-size=!SZ!

          :: ---- T4b: reverse argument order (--config-only --unattended) ----
          :: The loop-style parser should accept arguments in any order. This
          :: exercises two consecutive shift /1 and proves %0 is preserved
          :: across both. Uses a fresh temp so the log is unambiguous.
          mkdir "%ROOT%\config-only-rev" >nul 2>nul
          mkdir "%ROOT%\config-only-rev\temp" >nul 2>nul
          set "TEMP=%ROOT%\config-only-rev\temp"
          set "TMP=%ROOT%\config-only-rev\temp"
          :: Re-copy the bat so Configuration.xml lands in the rev case dir.
          copy /y "officeDeploy.bat" "%ROOT%\config-only-rev\officeDeploy.bat" >nul
          call "%ROOT%\config-only-rev\officeDeploy.bat" --config-only --unattended > "%ROOT%\config-only-rev\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T4b] FAIL: expected 0, got !RC! & exit /b 1 )
          if not exist "%ROOT%\config-only-rev\Configuration.xml" ( echo [T4b] FAIL: Configuration.xml missing & exit /b 1 )
          for %%A in ("%ROOT%\config-only-rev\Configuration.xml") do set "SZ=%%~zA"
          if !SZ! LEQ 0 ( echo [T4b] FAIL: Configuration.xml empty & exit /b 1 )
          :: Display Level must be None (unattended mode was detected). Avoid
          :: embedding literal quotes in findstr /c (CMD ends the string at "),
          :: so search for the unambiguous quote-free substrings instead.
          findstr /c:"Level=" "%ROOT%\config-only-rev\Configuration.xml" >nul || ( echo [T4b] FAIL: no Display Level & exit /b 1 )
          findstr /c:"None" "%ROOT%\config-only-rev\Configuration.xml" >nul || ( echo [T4b] FAIL: Display Level not None & exit /b 1 )
          if exist "%ROOT%\config-only-rev\setup.exe" ( echo [T4b] FAIL: setup.exe should not exist & exit /b 1 )
          echo [T4b] PASS config-only-reverse-order-exit=0
          :: Restore the forward-order temp for T6's log assertions below.
          set "TEMP=%ROOT%\config-only\temp"
          set "TMP=%ROOT%\config-only\temp"

          :: ---- T6: log must exist and carry the contract markers ----
          :: SCRIPT_PATH now reads %~f0 directly (root-cause fix), so this
          :: step is a true bare-shift root-cause regression: if shift is
          :: ever changed back to bare shift, %~f0 corrupts and T6 fails.
          if not exist "%TEMP%\office-deploy\office-deploy.log" ( echo [T6] FAIL: log missing & exit /b 1 )
          set "LOG=%TEMP%\office-deploy\office-deploy.log"
          findstr /c:"MODE=UNATTENDED" "%LOG%" >nul || ( echo [T6] FAIL: no MODE=UNATTENDED & exit /b 1 )
          findstr /c:"CONFIG_ONLY=1" "%LOG%" >nul || ( echo [T6] FAIL: no CONFIG_ONLY=1 & exit /b 1 )
          findstr /c:"ADMIN_CHECK=SKIPPED" "%LOG%" >nul || ( echo [T6] FAIL: no ADMIN_CHECK=SKIPPED & exit /b 1 )
          findstr /c:"RESULT=SUCCESS" "%LOG%" >nul || ( echo [T6] FAIL: no RESULT=SUCCESS & exit /b 1 )
          findstr /c:"EXIT_CODE=0" "%LOG%" >nul || ( echo [T6] FAIL: no EXIT_CODE=0 & exit /b 1 )

          :: Root-cause regression: SCRIPT_PATH (now %~f0) must EQUAL the
          :: BAT path exactly. If anyone reverts shift /1 to bare shift, %~f0
          :: corrupts (becomes CWD + last shifted arg) and this precise match
          :: fails -- it will not be masked by _self staying correct. Use
          :: case-insensitive compare to tolerate drive-letter/case variance.
          set "SP_LINE="
          for /f "usebackq tokens=1,* delims==" %%A in ("%LOG%") do (
            if "%%A"=="[office-deploy] SCRIPT_PATH" set "SP_LINE=%%B"
          )
          if not defined SP_LINE ( echo [T6] FAIL: SCRIPT_PATH line absent & exit /b 1 )
          set "EXPECTED=%ROOT%\config-only\officeDeploy.bat"
          if /i not "!SP_LINE!"=="!EXPECTED!" (
            echo [T6] FAIL: SCRIPT_PATH mismatch
            echo   expected: !EXPECTED!
            echo   actual:   !SP_LINE!
            exit /b 1
          )
          echo [T6] PASS log-markers-ok SCRIPT_PATH=!SP_LINE!

          exit /b 0

      # ----------------------------------------------------------------------
      # T5: validate the Configuration.xml that the BAT actually generated
      # at runtime (not a static echo reconstruction).
      # ----------------------------------------------------------------------
      - name: T5 Validate generated XML
        shell: pwsh
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP 'office-deploy-tests\config-only\Configuration.xml'
          if (-not (Test-Path -LiteralPath $cfg)) { throw "Configuration.xml not found at $cfg" }
          [xml]$xml = Get-Content -LiteralPath $cfg -Raw

          function Assert-True($cond, $msg) {
            if (-not $cond) { throw "ASSERT FAILED: $msg" }
          }

          $add = $xml.Configuration.Add
          Assert-True ($add.OfficeClientEdition -eq '64') "OfficeClientEdition=64"
          Assert-True ($add.Channel -eq 'MonthlyEnterprise') "Channel=MonthlyEnterprise"

          $prod = $add.Product
          Assert-True ($prod.ID -eq 'O365ProPlusRetail') "Product ID=O365ProPlusRetail"

          Assert-True ($prod.Language.ID -eq 'zh-cn') "Language ID=zh-cn"

          $disp = $xml.Configuration.Display
          Assert-True ($disp.Level -eq 'None') "Display Level=None"
          Assert-True ($disp.AcceptEULA -eq 'TRUE') "AcceptEULA=TRUE"

          $upd = $xml.Configuration.Updates
          Assert-True ($upd.Enabled -eq 'FALSE') "Updates Enabled=FALSE"

          Assert-True ($null -ne $xml.Configuration.RemoveMSI) "RemoveMSI present"

          $excludes = @()
          foreach ($e in $prod.ExcludeApp) { $excludes += $e.ID }
          foreach ($expected in 'Groove','Lync','OneDrive','OutlookForWindows','Teams') {
            Assert-True ($excludes -contains $expected) "ExcludeApp contains $expected"
          }

          Write-Host "[T5] PASS generated-xml valid; excludes=$($excludes -join ',')"

      # ----------------------------------------------------------------------
      # T7: working-directory independence. The BAT sits in dir A, we run
      # it from dir B, and Configuration.xml must land in A (%~dp0).
      # ----------------------------------------------------------------------
      - name: T7 Working directory independence
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\working-dir\bat" >nul 2>nul
          mkdir "%ROOT%\working-dir\cwd" >nul 2>nul
          mkdir "%ROOT%\working-dir\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\working-dir\bat\officeDeploy.bat" >nul

          set "TEMP=%ROOT%\working-dir\temp"
          set "TMP=%ROOT%\working-dir\temp"

          pushd "%ROOT%\working-dir\cwd"
          call "%ROOT%\working-dir\bat\officeDeploy.bat" --unattended --config-only > "%ROOT%\working-dir\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          popd

          if not "!RC!"=="0" ( echo [T7] FAIL: expected 0, got !RC! & exit /b 1 )
          if not exist "%ROOT%\working-dir\bat\Configuration.xml" ( echo [T7] FAIL: xml not in script dir & exit /b 1 )
          if exist "%ROOT%\working-dir\cwd\Configuration.xml" ( echo [T7] FAIL: xml leaked into cwd & exit /b 1 )
          echo [T7] PASS script-relative-config-ok
          exit /b 0

      # ----------------------------------------------------------------------
      # T8: path with spaces. Exercises %~f0 / %~dp0 / _cfg / _setup
      # quoting against a script directory that itself contains spaces.
      # ----------------------------------------------------------------------
      - name: T8 Path with spaces
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\Office Deploy Runtime"
          mkdir "%ROOT%\Case With Spaces" >nul 2>nul
          mkdir "%ROOT%\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\Case With Spaces\officeDeploy.bat" >nul

          set "TEMP=%ROOT%\temp"
          set "TMP=%ROOT%\temp"

          pushd "%RUNNER_TEMP%"
          call "%ROOT%\Case With Spaces\officeDeploy.bat" --unattended --config-only > "%ROOT%\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          popd

          if not "!RC!"=="0" ( echo [T8] FAIL: expected 0, got !RC! & exit /b 1 )
          if not exist "%ROOT%\Case With Spaces\Configuration.xml" ( echo [T8] FAIL: xml not in spaced script dir & exit /b 1 )
          echo [T8] PASS path-with-spaces-ok
          exit /b 0

      # ----------------------------------------------------------------------
      # T9: invalid cached setup.exe recovery. Fault injection:
      #   fake setup.exe (plain text)      -> Authenticode invalid
      #   setup.exe.download.tmp (DIR)     -> del cannot remove a directory
      # Control flow: validate fails -> cache removed -> stale temp present
      # -> del fails -> STALE_TEMP_REMOVE_FAILED -> exit 31.
      # This terminates inside :ensure_odt BEFORE the Invoke-WebRequest line,
      # so no ODT network download and no Office install can occur.
      # ----------------------------------------------------------------------
      - name: T9 Invalid cached setup.exe recovery
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\cache-recovery" >nul 2>nul
          mkdir "%ROOT%\cache-recovery\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\cache-recovery\officeDeploy.bat" >nul

          :: Fake cached setup.exe: plain text, never a valid Authenticode PE.
          echo this-is-not-a-valid-odt-setup-exe > "%ROOT%\cache-recovery\setup.exe"
          :: Stale temp download as a DIRECTORY: "del /f /q" cannot delete it,
          :: which deterministically drives the stale-temp-remove-failed branch.
          mkdir "%ROOT%\cache-recovery\setup.exe.download.tmp" >nul

          set "TEMP=%ROOT%\cache-recovery\temp"
          set "TMP=%ROOT%\cache-recovery\temp"

          call "%ROOT%\cache-recovery\officeDeploy.bat" --unattended > "%ROOT%\cache-recovery\run.out" 2>&1
          set "RC=!ERRORLEVEL!"

          :: Stable exit code must be 31 (and not 10/30/50/60).
          if not "!RC!"=="31" (
            echo [T9] FAIL: expected exit 31, got !RC!
            type "%ROOT%\cache-recovery\run.out"
            exit /b 1
          )

          :: Invalid cached final must have been removed during recovery.
          if exist "%ROOT%\cache-recovery\setup.exe" (
            echo [T9] FAIL: fake setup.exe should have been removed
            exit /b 1
          )
          :: Stale temp directory must still exist (del cannot remove a dir).
          if not exist "%ROOT%\cache-recovery\setup.exe.download.tmp\" (
            echo [T9] FAIL: stale temp dir unexpectedly removed
            exit /b 1
          )

          :: Guard: the recovery must NOT have reached a real download.
          findstr /c:"Downloading setup.exe from Microsoft CDN" "%ROOT%\cache-recovery\run.out" >nul && (
            echo [T9] FAIL: reached ODT network download - fault injection broken
            exit /b 1
          )
          :: Guard: must NOT have reached the Office install stage.
          findstr /c:"STAGE=INSTALL" "%ROOT%\cache-recovery\run.out" >nul && (
            echo [T9] FAIL: reached Office install stage
            exit /b 1
          )

          :: Required log markers (unattended log lives under isolated TEMP).
          set "LOG=%TEMP%\office-deploy\office-deploy.log"
          if not exist "%LOG%" ( echo [T9] FAIL: log missing & exit /b 1 )
          findstr /c:"ODT_CACHE_VALID=FALSE" "%LOG%" >nul || ( echo [T9] FAIL: no ODT_CACHE_VALID=FALSE & exit /b 1 )
          findstr /c:"ODT_RECOVERY=INVALID_CACHE_REMOVED" "%LOG%" >nul || ( echo [T9] FAIL: no INVALID_CACHE_REMOVED & exit /b 1 )
          findstr /c:"ODT_RECOVERY=STALE_TEMP_REMOVE_FAILED" "%LOG%" >nul || ( echo [T9] FAIL: no STALE_TEMP_REMOVE_FAILED & exit /b 1 )
          findstr /c:"RESULT=FAILED" "%LOG%" >nul || ( echo [T9] FAIL: no RESULT=FAILED & exit /b 1 )
          findstr /c:"EXIT_CODE=31" "%LOG%" >nul || ( echo [T9] FAIL: no EXIT_CODE=31 & exit /b 1 )

          echo [T9] PASS invalid-cache-recovery-exit=31 no-network no-install
          exit /b 0

      # ----------------------------------------------------------------------
      # T11: interactive menu runtime verification. This is the only test that
      # exercises the interactive menu. It pipes "3" to choose Exit, so the
      # menu is rendered, the Exit branch is taken, and NO installation or
      # activation path is entered. This deliberately never sends "2", so no
      # activation logic is executed in CI.
      # ----------------------------------------------------------------------
      - name: T11 Interactive menu
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\interactive" >nul 2>nul
          mkdir "%ROOT%\interactive\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\interactive\officeDeploy.bat" >nul

          set "TEMP=%ROOT%\interactive\temp"
          set "TMP=%ROOT%\interactive\temp"

          :: choice /c 123 reads the first key and returns; the trailing CR/LF
          :: from echo is then consumed by the interactive "pause" at :finish.
          echo 3| call "%ROOT%\interactive\officeDeploy.bat" > "%ROOT%\interactive\run.out" 2>&1
          set "RC=!ERRORLEVEL!"

          :: Exit mapping for option [3] must be exit 0.
          if not "!RC!"=="0" ( echo [T11] FAIL: expected exit 0, got !RC! & type "%ROOT%\interactive\run.out" & exit /b 1 )

          :: The three menu options must be rendered exactly.
          findstr /c:"[1] Install Microsoft 365 Apps for enterprise" "%ROOT%\interactive\run.out" >nul || ( echo [T11] FAIL: option [1] missing & exit /b 1 )
          findstr /c:"[2] Activate installed Office" "%ROOT%\interactive\run.out" >nul || ( echo [T11] FAIL: option [2] missing & exit /b 1 )
          findstr /c:"[3] Exit" "%ROOT%\interactive\run.out" >nul || ( echo [T11] FAIL: option [3] missing & exit /b 1 )

          :: Neutral header title is now rendered.
          findstr /c:"Microsoft Office Deployment Utility" "%ROOT%\interactive\run.out" >nul || ( echo [T11] FAIL: neutral title missing & exit /b 1 )

          :: Guards: choosing Exit must NOT reach the install/activate paths.
          if exist "%ROOT%\interactive\Configuration.xml" ( echo [T11] FAIL: Configuration.xml leaked & exit /b 1 )
          if exist "%ROOT%\interactive\setup.exe" ( echo [T11] FAIL: setup.exe leaked & exit /b 1 )
          if exist "%ROOT%\interactive\setup.exe.download.tmp" ( echo [T11] FAIL: tmp leaked & exit /b 1 )
          findstr /c:"STAGE=INSTALL" "%ROOT%\interactive\run.out" >nul && ( echo [T11] FAIL: reached Office install stage & exit /b 1 )
          findstr /c:"Checking for an installed Microsoft Office" "%ROOT%\interactive\run.out" >nul && ( echo [T11] FAIL: reached activation path & exit /b 1 )

          :: Static structural assertion: option [2] dispatches to the new
          :: activate-installed-Office entry, and that entry label exists.
          findstr /c:"goto activate_existing" "%ROOT%\interactive\officeDeploy.bat" >nul || ( echo [T11] FAIL: menu does not dispatch to activate_existing & exit /b 1 )
          findstr /b /c:":activate_existing" "%ROOT%\interactive\officeDeploy.bat" >nul || ( echo [T11] FAIL: :activate_existing label missing & exit /b 1 )

          echo [T11] PASS interactive-menu-rendered exit-mapping=0 no-install no-activation
          exit /b 0

      # ----------------------------------------------------------------------
      # T12: option [2] "Activate installed Office" detection control flow.
      # The only test that executes option [2]. It drives the real MAS-derived
      # :oh_check_supported_office detector (:oh_getpath registry+marker file,
      # PLUS the upstream ClickToRun service validity check) against mocked
      # fixtures, then stops BEFORE :oh_activate_core, so no Ohook activation
      # or licensing mutation ever runs in CI.
      #
      # IMPORTANT: there is NO test seam in production officeDeploy.bat. CI
      # instruments the COPIED test bat at runtime, inserting a `goto finish`
      # right after the "detected" echo inside :activate_existing so the Ohook
      # call becomes unreachable. Production code is never test-gated.
      #   A: 64-bit Click-to-Run (registry + marker + service present)  PASS
      #   B: 32-bit MSI           (Wow6432Node + *Picker.dll)            PASS
      #   C: registry present but NO marker file         -> REJECTED (70)
      #   D: registry + marker but NO ClickToRun service -> REJECTED (70)
      #   E: broken C2R + valid MSI mixed -> o16c2r cleared, o16msi kept,
      #      error=1 survives (locks the set error= ordering fix)
      # Also guards the Wow6432Node spelling so the 32-bit regression cannot
      # silently return.
      # ----------------------------------------------------------------------
      - name: T12 option [2] detection (read-only, mocked registry + marker + service)
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\activate-detect" >nul 2>nul
          mkdir "%ROOT%\activate-detect\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\activate-detect\officeDeploy.bat" >nul
          set "TEMP=%ROOT%\activate-detect\temp"
          set "TMP=%ROOT%\activate-detect\temp"

          :: Instrument the COPY (never the checked-in bat): insert a
          :: `goto finish` immediately after the unique "detected" echo in
          :activate_existing so :oh_activate_core becomes unreachable in CI.
          :: Anchor is unique to :activate_existing (the [1] post-install path
          :: has no such line). Uses a backtick-n newline in PowerShell.
          powershell -NoProfile -Command "$f='%ROOT%\activate-detect\officeDeploy.bat'; $a='echo Microsoft Office detected. Proceeding with Ohook activation.'; $t=Get-Content -LiteralPath $f -Raw; if($t -notlike ('*'+$a+'*')){exit 1}; $t=$t -replace [regex]::Escape($a), ($a+\"`r`ngoto finish\"); Set-Content -LiteralPath $f -Value $t -NoNewline; exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T12] FAIL: instrumentation anchor not found & exit /b 1 )

          :: Static guard: production bat must NOT carry any test seam.
          findstr /c:"OFFICE_DEPLOY_TEST_DETECT_ONLY" "officeDeploy.bat" >nul && ( echo [T12] FAIL: test seam present in production bat & exit /b 1 )

          :: Helper: wipe every Office detection key + fixture dir between
          :: scenarios so a leftover cannot satisfy a later scenario.
          :: :oh_getpath reads these keys (C2R InstallPath / MSI InstallRoot
          :: Path) and then requires a marker FILE under the install path;
          :: :oh_check_supported_office additionally requires ClickToRunSvc.
          set "CLEAN_KEYS=HKLM\SOFTWARE\Microsoft\Office\ClickToRun HKLM\SOFTWARE\Microsoft\Office\15.0\ClickToRun HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\16.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\16.0\Common\InstallRoot HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\15.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\15.0\Common\InstallRoot HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\14.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\14.0\Common\InstallRoot"
          rmdir /s /q "C:\Fix16" >nul 2>nul
          rmdir /s /q "C:\Fix16x86" >nul 2>nul
          rmdir /s /q "C:\NoMarker" >nul 2>nul
          rmdir /s /q "C:\NoSvc" >nul 2>nul
          :: Remove any leftover test services from prior runs, best-effort.
          sc delete ClickToRunSvc >nul 2>nul
          sc delete OfficeSvc >nul 2>nul

          :: ---- Scenario A: 64-bit C2R + marker + service present ----
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          :: :oh_getpath reads ClickToRun\InstallPath, then checks
          :: <InstallPath>\root\Licenses16\ProPlus*.xrm-ms.
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f /v InstallPath /t REG_SZ /d "C:\Fix16" >nul || ( echo [T12a] FAIL: reg add InstallPath & exit /b 1 )
          mkdir "C:\Fix16\root\Licenses16" >nul 2>nul
          echo dummy-license > "C:\Fix16\root\Licenses16\ProPlusDummy.xrm-ms"
          :: Create a dummy ClickToRunSvc so sc query returns 0 (present).
          :: `binPath` must be quoted; sc create rejects a missing binary but
          :: still registers the service name, which is all sc query checks.
          sc create ClickToRunSvc binPath= "%SystemRoot%\system32\cmd.exe" >nul || ( echo [T12a] FAIL: sc create ClickToRunSvc & exit /b 1 )

          echo 2| call "%ROOT%\activate-detect\officeDeploy.bat" > "%ROOT%\activate-detect\a.out" 2>&1
          set "RC=!ERRORLEVEL!"
          sc delete ClickToRunSvc >nul 2>nul
          if not "!RC!"=="0" ( echo [T12a] FAIL: expected exit 0, got !RC! & type "%ROOT%\activate-detect\a.out" & exit /b 1 )
          findstr /c:"Microsoft Office detected" "%ROOT%\activate-detect\a.out" >nul || ( echo [T12a] FAIL: not detected & type "%ROOT%\activate-detect\a.out" & exit /b 1 )
          findstr /c:"Activating your Office" "%ROOT%\activate-detect\a.out" >nul && ( echo [T12a] FAIL: reached Ohook activation & exit /b 1 )
          findstr /c:"No supported Microsoft Office" "%ROOT%\activate-detect\a.out" >nul && ( echo [T12a] FAIL: falsely rejected & exit /b 1 )
          echo [T12a] PASS clicktorun-x64 registry+marker+service detected no-ohook

          :: ---- Scenario B: 32-bit MSI (Wow6432Node) + marker file ----
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          :: MSI installs are not gated on ClickToRunSvc, so no service here.
          :: :oh_getpath reads 16.0\Common\InstallRoot\Path, then checks
          :: <Path>\*Picker.dll.
          reg add "HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\16.0\Common\InstallRoot" /f /v Path /t REG_SZ /d "C:\Fix16x86" >nul || ( echo [T12b] FAIL: reg add MSI root & exit /b 1 )
          mkdir "C:\Fix16x86" >nul 2>nul
          echo dummy-picker > "C:\Fix16x86\DummyPicker.dll"

          echo 2| call "%ROOT%\activate-detect\officeDeploy.bat" > "%ROOT%\activate-detect\b.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T12b] FAIL: expected exit 0, got !RC! & type "%ROOT%\activate-detect\b.out" & exit /b 1 )
          findstr /c:"Microsoft Office detected" "%ROOT%\activate-detect\b.out" >nul || ( echo [T12b] FAIL: not detected & type "%ROOT%\activate-detect\b.out" & exit /b 1 )
          findstr /c:"Activating your Office" "%ROOT%\activate-detect\b.out" >nul && ( echo [T12b] FAIL: reached Ohook activation & exit /b 1 )
          findstr /c:"No supported Microsoft Office" "%ROOT%\activate-detect\b.out" >nul && ( echo [T12b] FAIL: falsely rejected & exit /b 1 )
          echo [T12b] PASS msi-x86-wow6432node registry+marker detected no-ohook

          :: ---- Scenario C: registry present, marker file ABSENT -> REJECT ----
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f /v InstallPath /t REG_SZ /d "C:\NoMarker" >nul || ( echo [T12c] FAIL: reg add InstallPath & exit /b 1 )
          :: Deliberately do NOT create C:\NoMarker\root\Licenses16\ProPlus*.xrm-ms.

          echo 2| call "%ROOT%\activate-detect\officeDeploy.bat" > "%ROOT%\activate-detect\c.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="70" ( echo [T12c] FAIL: expected exit 70, got !RC! & type "%ROOT%\activate-detect\c.out" & exit /b 1 )
          findstr /c:"No supported Microsoft Office installation was found." "%ROOT%\activate-detect\c.out" >nul || ( echo [T12c] FAIL: reject message missing & type "%ROOT%\activate-detect\c.out" & exit /b 1 )
          findstr /c:"Microsoft Office detected" "%ROOT%\activate-detect\c.out" >nul && ( echo [T12c] FAIL: falsely detected & exit /b 1 )
          findstr /c:"Activating your Office" "%ROOT%\activate-detect\c.out" >nul && ( echo [T12c] FAIL: reached Ohook activation & exit /b 1 )
          echo [T12c] PASS registry-without-marker rejected exit=70 no-ohook

          :: ---- Scenario D: registry + marker but NO ClickToRun service -> REJECT ----
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          sc delete ClickToRunSvc >nul 2>nul
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f /v InstallPath /t REG_SZ /d "C:\NoSvc" >nul || ( echo [T12d] FAIL: reg add InstallPath & exit /b 1 )
          mkdir "C:\NoSvc\root\Licenses16" >nul 2>nul
          echo dummy-license > "C:\NoSvc\root\Licenses16\ProPlusDummy.xrm-ms"
          :: Deliberately do NOT create ClickToRunSvc; sc query -> 1060.

          echo 2| call "%ROOT%\activate-detect\officeDeploy.bat" > "%ROOT%\activate-detect\d.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="70" ( echo [T12d] FAIL: expected exit 70, got !RC! & type "%ROOT%\activate-detect\d.out" & exit /b 1 )
          findstr /c:"No supported Microsoft Office installation was found." "%ROOT%\activate-detect\d.out" >nul || ( echo [T12d] FAIL: reject message missing & type "%ROOT%\activate-detect\d.out" & exit /b 1 )
          findstr /c:"Not found, Office 16.0 files found" "%ROOT%\activate-detect\d.out" >nul || ( echo [T12d] FAIL: service-check message missing & type "%ROOT%\activate-detect\d.out" & exit /b 1 )
          findstr /c:"Microsoft Office detected" "%ROOT%\activate-detect\d.out" >nul && ( echo [T12d] FAIL: falsely detected despite missing service & exit /b 1 )
          findstr /c:"Activating your Office" "%ROOT%\activate-detect\d.out" >nul && ( echo [T12d] FAIL: reached Ohook activation & exit /b 1 )
          echo [T12d] PASS registry+marker-without-service rejected exit=70 no-ohook

          :: ---- Scenario E: broken C2R + valid MSI mixed (detector only) ----
          :: Drives the shared detector directly (no Ohook) to prove that a
          :: broken C2R (marker present, ClickToRunSvc absent) is cleared
          :: while a valid MSI is retained, AND that error=1 survives -- it
          :: is not swallowed by a misplaced reset. This locks the upstream
          :: ordering fix (set error= BEFORE the detector in :oh_activate_core).
          :: Start from a FRESH copy (so scenario A's goto-finish injection
          :: does not interfere), then inject a top dispatcher that jumps to
          :: a :t12e_probe label which runs ONLY the detector and prints
          :: flag/error state. Production bat is untouched.
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          sc delete ClickToRunSvc >nul 2>nul
          :: Broken C2R: registry + marker, but NO service.
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f /v InstallPath /t REG_SZ /d "C:\MixC2R" >nul || ( echo [T12e] FAIL: reg add C2R & exit /b 1 )
          mkdir "C:\MixC2R\root\Licenses16" >nul 2>nul
          echo dummy-license > "C:\MixC2R\root\Licenses16\ProPlusDummy.xrm-ms"
          :: Valid MSI (64-bit view) with its marker file.
          reg add "HKLM\SOFTWARE\Microsoft\Office\16.0\Common\InstallRoot" /f /v Path /t REG_SZ /d "C:\MixMSI" >nul || ( echo [T12e] FAIL: reg add MSI & exit /b 1 )
          mkdir "C:\MixMSI" >nul 2>nul
          echo dummy-picker > "C:\MixMSI\DummyPicker.dll"

          copy /y "officeDeploy.bat" "%ROOT%\activate-detect\probe.bat" >nul
          :: Build dispatcher + probe with PowerShell SINGLE-quoted strings
          :: and explicit CRLF ([char]13+[char]10). The probe echoes variable
          :: values with !var! syntax; those literal exclamation marks must
          :: survive the cmd run-block, which has EnableDelayedExpansion ON
          :: and would expand !o16c2r! to empty. So emit '!' as [char]33 and
          :: the variable name separately, assembling the string in PS so cmd
          :: never sees a literal '!'.
          powershell -NoProfile -Command "$f='%ROOT%\activate-detect\probe.bat'; $nl=[char]13+[char]10; $x=[char]33; $t=[IO.File]::ReadAllText($f); $m=[regex]::Match($t,'\A@set masver=[0-9.]+'); if(-not $m.Success){exit 1}; $old=$m.Value; $d1='@echo off'+$nl+'setlocal EnableExtensions EnableDelayedExpansion'+$nl+'if defined _T12E_PROBE ( goto :t12e_probe )'+$nl+$old; $p1=':t12e_probe'+$nl+'set error='+$nl+'call :oh_check_supported_office'+$nl+'echo PROBE_o16c2r='+$x+'o16c2r'+$x+$nl+'echo PROBE_o16msi='+$x+'o16msi'+$x+$nl+'echo PROBE_error='+$x+'error'+$x+$nl+'exit /b 0'+$nl; $t=$d1 + $t.Substring($old.Length) + $nl + $p1; [IO.File]::WriteAllText($f,$t); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T12e] FAIL: probe injection failed & exit /b 1 )

          set "_T12E_PROBE=1"
          call "%ROOT%\activate-detect\probe.bat" > "%ROOT%\activate-detect\e.out" 2>&1
          set "RC=!ERRORLEVEL!"
          set "_T12E_PROBE="

          if not "!RC!"=="0" ( echo [T12e] FAIL: probe returned !RC! & type "%ROOT%\activate-detect\e.out" & exit /b 1 )
          :: Broken C2R must have been cleared (empty value after =).
          findstr /c:"PROBE_o16c2r=" "%ROOT%\activate-detect\e.out" >nul || ( echo [T12e] FAIL: probe o16c2r line missing & type "%ROOT%\activate-detect\e.out" & exit /b 1 )
          findstr /c:"PROBE_o16c2r=1" "%ROOT%\activate-detect\e.out" >nul && ( echo [T12e] FAIL: o16c2r not cleared & exit /b 1 )
          :: Valid MSI must be retained.
          findstr /c:"PROBE_o16msi=1" "%ROOT%\activate-detect\e.out" >nul || ( echo [T12e] FAIL: o16msi not retained & type "%ROOT%\activate-detect\e.out" & exit /b 1 )
          :: error must be 1 (broken C2R detected) and NOT swallowed.
          findstr /c:"PROBE_error=1" "%ROOT%\activate-detect\e.out" >nul || ( echo [T12e] FAIL: error not set to 1 & type "%ROOT%\activate-detect\e.out" & exit /b 1 )
          :: Service-check message must appear.
          findstr /c:"Not found, Office 16.0 files found" "%ROOT%\activate-detect\e.out" >nul || ( echo [T12e] FAIL: service-check message missing & type "%ROOT%\activate-detect\e.out" & exit /b 1 )
          echo [T12e] PASS mixed broken-c2r+valid-msi o16c2r-cleared o16msi-retained error=1

          :: ---- Static guards: Wow6432Node spelling must not regress ----
          findstr /c:"WOW64Node\Microsoft" "%ROOT%\activate-detect\officeDeploy.bat" >nul && ( echo [T12] FAIL: WOW64Node typo present & exit /b 1 )
          findstr /c:"Wow6432Node\Microsoft" "%ROOT%\activate-detect\officeDeploy.bat" >nul || ( echo [T12] FAIL: Wow6432Node key missing & exit /b 1 )
          echo [T12] PASS wow6432node-spelling-guard

          exit /b 0

      # ----------------------------------------------------------------------
      # T13: :oh_activate_core fail-fast regression. The most important new
      # defense-in-depth guard: when NO supported Office is present, core must
      # abort BEFORE the per-product routines and BEFORE the unconditional
      # :oh_clearblock / :oh_uninstkey / :oh_licrefresh cleanup (which mutate
      # license state). T12 stops before core, so this drives core directly.
      # It instruments the test COPY with a RUN_CORE dispatcher (never the
      # production bat), stubs the licensing-health calls so CI cannot repair
      # or reinstall runner licensing state, and asserts core exits non-zero
      # without ever reaching the cleanup markers.
      # ----------------------------------------------------------------------
      - name: T13 oh_activate_core fail-fast (no Office)
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\core-failfast" >nul 2>nul
          mkdir "%ROOT%\core-failfast\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\core-failfast\officeDeploy.bat" >nul
          set "TEMP=%ROOT%\core-failfast\temp"
          set "TMP=%ROOT%\core-failfast\temp"

          :: Ensure the runner has no supported Office keys/services so the
          :: shared :oh_check_supported_office clears every o* flag.
          for %%K in (HKLM\SOFTWARE\Microsoft\Office\ClickToRun HKLM\SOFTWARE\Microsoft\Office\15.0\ClickToRun HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\16.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\16.0\Common\InstallRoot) do reg delete "%%K" /f >nul 2>nul

          :: Instrument the COPY: replace the version-independent first line
          :: with a RUN_CORE dispatcher + that same line. Uses the SAME
          :: proven PowerShell -replace pattern as T12 (double-quoted
          :: replacement string so `r`n becomes real CRLF). The dispatcher
          :: avoids cmd-expanded tokens: it checks _T13_RUN_CORE (set by the
          :: caller below) instead of %1, and uses goto :eof to propagate
          :: the called label's errorlevel. The anchored masver regex keeps the
          :: instrumentation independent of future embedded Ohook versions.
          powershell -NoProfile -Command "$f='%ROOT%\core-failfast\officeDeploy.bat'; $t=[IO.File]::ReadAllText($f); $m=[regex]::Match($t,'\A@set masver=[0-9.]+'); if(-not $m.Success){exit 1}; $old=$m.Value; $new=\"@echo off`r`nsetlocal EnableExtensions EnableDelayedExpansion`r`nif defined _T13_RUN_CORE ( call :oh_activate_core ^& goto :eof )`r`n\"+$old; $t=$new + $t.Substring($old.Length); $t=$t.Replace('call :dk_sppissue','rem T13 dk_sppissue stub').Replace('call :dk_errorcheck','rem T13 dk_errorcheck stub'); [IO.File]::WriteAllText($f,$t); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T13] FAIL: dispatcher injection failed & exit /b 1 )

          :: Drive core with _T13_RUN_CORE set.
          set "_T13_RUN_CORE=1"
          call "%ROOT%\core-failfast\officeDeploy.bat" > "%ROOT%\core-failfast\out.txt" 2>&1
          set "RC=!ERRORLEVEL!"
          set "_T13_RUN_CORE="

          :: Core must return non-zero (exit /b 1 from the fail-fast).
          if "!RC!"=="0" ( echo [T13] FAIL: expected non-zero, got 0 & type "%ROOT%\core-failfast\out.txt" & exit /b 1 )
          :: Must print the no-Office abort line.
          findstr /c:"No supported Microsoft Office was found to activate." "%ROOT%\core-failfast\out.txt" >nul || ( echo [T13] FAIL: abort line missing & type "%ROOT%\core-failfast\out.txt" & exit /b 1 )
          :: Must NOT reach the mutating cleanup routines. These are their
          :: distinctive success echoes (only printed if the routine runs).
          findstr /c:"Clearing Office License Blocks" "%ROOT%\core-failfast\out.txt" >nul && ( echo [T13] FAIL: reached oh_clearblock & type "%ROOT%\core-failfast\out.txt" & exit /b 1 )
          findstr /c:"Uninstalling Other/Grace Keys" "%ROOT%\core-failfast\out.txt" >nul && ( echo [T13] FAIL: reached oh_uninstkey & type "%ROOT%\core-failfast\out.txt" & exit /b 1 )
          :: Must NOT proceed into per-product activation echoes.
          findstr /c:"Activating Office..." "%ROOT%\core-failfast\out.txt" >nul && ( echo [T13] FAIL: reached per-product activation & type "%ROOT%\core-failfast\out.txt" & exit /b 1 )
          echo [T13] PASS core-failfast no-office abort-before-cleanup rc=!RC!

          exit /b 0

      # ----------------------------------------------------------------------
      # T14: Repository Blob EOL Contract. The single most important guard
      # against the line-ending regression. It extracts the EXACT bytes Git
      # stores for officeDeploy.bat (what an end user fetches as the raw blob)
      # and asserts, byte-for-byte, that every line ending is CRLF and none is
      # bare LF. It also reports the working-tree file EOL, so a future
      # checkout-normalization surprise becomes visible in the log. The
      # `-text` rule in .gitattributes is what makes the stored blob keep CRLF;
      # if anyone weakens it to `text eol=crlf`, the blob reverts to LF and
      # this step fails. NOTE: green CI on the prior LF blob proved LF does not
      # ALWAYS break call:label on Server 2022, so this is hardening, not a
      # proven single root cause -- but it removes the risk factor for good.
      # ----------------------------------------------------------------------
      - name: T14 Repository blob CRLF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'office-deploy-tests\blob'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $blob = Join-Path $dir 'officeDeploy-blob.bat'

          # Extract the raw blob bytes Git stores. Start-Process stdout
          # redirection writes bytes verbatim, no PowerShell text/codepage
          # translation that would corrupt the EOL measurement.
          $proc = Start-Process -FilePath git -ArgumentList 'cat-file','blob','HEAD:officeDeploy.bat' -RedirectStandardOutput $blob -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "[T14] FAIL: git cat-file exit $($proc.ExitCode)" }

          function Measure-Eol([byte[]]$b) {
            $crlf = 0; $lf = 0
            for ($i = 0; $i -lt $b.Length; $i++) {
              if ($b[$i] -eq 10) { if ($i -gt 0 -and $b[$i - 1] -eq 13) { $crlf++ } else { $lf++ } }
            }
            @{ CRLF = $crlf; LFOnly = $lf }
          }

          $blobBytes = [IO.File]::ReadAllBytes($blob)
          $workBytes = [IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE 'officeDeploy.bat'))
          $bm = Measure-Eol $blobBytes
          $wm = Measure-Eol $workBytes
          Write-Host "[T14] blob     CRLF=$($bm.CRLF) LF_only=$($bm.LFOnly)"
          Write-Host "[T14] worktree CRLF=$($wm.CRLF) LF_only=$($wm.LFOnly)"

          if ($bm.CRLF -eq 0)  { throw "[T14] FAIL: blob contains no CRLF line endings" }
          if ($bm.LFOnly -ne 0) { throw "[T14] FAIL: blob contains $($bm.LFOnly) LF-only line endings" }
          Write-Host "[T14] PASS repository-blob-is-crlf"

      # ----------------------------------------------------------------------
      # T15: Repository Blob Runtime. Run the EXACT blob bytes (what end users
      # download) the way a user runs it -- via `call`. Asserts the control
      # flow survives end to end: exit 0, Configuration.xml generated and
      # non-empty, no setup.exe / tmp, and -- critically -- the output must
      # NOT contain any batch-control-flow-break signature ('system cannot find
      # the batch label' and its zh equivalents). This is the test that would
      # have surfaced the original production failure regardless of its exact
      # trigger, because it exercises the distributed artifact directly.
      # ----------------------------------------------------------------------
      - name: T15 Repository blob runtime
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "SRC=%RUNNER_TEMP%\office-deploy-tests\blob\officeDeploy-blob.bat"
          if not exist "%SRC%" ( echo [T15] FAIL: blob missing - T14 must run first & exit /b 1 )
          set "BDIR=%RUNNER_TEMP%\office-deploy-tests\blob-runtime"
          mkdir "%BDIR%\temp" >nul 2>nul
          :: Copy the blob into BDIR so Configuration.xml lands under BDIR (its
          :: %%~dp0) and stays inside the office-deploy-tests artifact glob.
          copy /y "%SRC%" "%BDIR%\officeDeploy.bat" >nul
          set "TEMP=%BDIR%\temp"
          set "TMP=%BDIR%\temp"

          call "%BDIR%\officeDeploy.bat" --unattended --config-only > "%BDIR%\run.out" 2>&1
          set "RC=!ERRORLEVEL!"

          if not "!RC!"=="0" ( echo [T15] FAIL: blob run exit !RC! & type "%BDIR%\run.out" & exit /b 1 )
          if not exist "%BDIR%\Configuration.xml" ( echo [T15] FAIL: Configuration.xml missing & type "%BDIR%\run.out" & exit /b 1 )
          for %%A in ("%BDIR%\Configuration.xml") do set "SZ=%%~zA"
          if !SZ! LEQ 0 ( echo [T15] FAIL: Configuration.xml empty & exit /b 1 )

          :: Negative text guard lives in the T15b PowerShell step below, NOT
          :: here: a non-ASCII (zh) search string inside a cmd script is
          :: mis-tokenized by the OEM codepage and breaks this script's own
          :: parser ("in was unexpected at this time", exit 255).

          if exist "%BDIR%\setup.exe" ( echo [T15] FAIL: setup.exe leaked & exit /b 1 )
          if exist "%BDIR%\setup.exe.download.tmp" ( echo [T15] FAIL: tmp leaked & exit /b 1 )

          :: Config-only unattended log must report SUCCESS / 0.
          set "LOG=%TEMP%\office-deploy\office-deploy.log"
          if exist "%LOG%" findstr /c:"RESULT=SUCCESS" "%LOG%" >nul || ( echo [T15] FAIL: no RESULT=SUCCESS in log & exit /b 1 )

          echo [T15] PASS blob-runtime-exit=0 xml-size=!SZ!
          exit /b 0

      # ----------------------------------------------------------------------
      # T15b: Negative text guard for the blob run output. Scans run.out for
      # ANY batch-control-flow-break signature, English AND Chinese. Done in
      # PowerShell because non-ASCII search strings are unreliable inside a
      # cmd script (the OEM codepage mis-tokenizes them and breaks parsing).
      # ----------------------------------------------------------------------
      - name: T15b Blob output signature guard
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'office-deploy-tests\blob-runtime\run.out'
          if (-not (Test-Path -LiteralPath $out)) { throw "[T15b] FAIL: run.out missing - T15 must run first" }
          # run.out is captured by cmd redirection. On en-US runners it is
          # ASCII (English), so ReadAllText decodes it losslessly and the
          # English signature is authoritative. The zh signatures are kept so
          # the guard also fires on a zh-locale host.
          $txt = [IO.File]::ReadAllText($out)
          $signatures = @(
            'system cannot find the batch label',
            'the system cannot find the file',
            '系统找不到指定的批处理标签',
            '找不到批处理文件'
          )
          foreach ($s in $signatures) {
            if ($txt -like "*$s*") {
              Write-Host "--- run.out ---"
              Get-Content -LiteralPath $out
              throw "[T15b] FAIL: forbidden signature in blob output: $s"
            }
          }
          Write-Host "[T15b] PASS no batch-control-flow-break signature in blob output"

      # ----------------------------------------------------------------------
      # T16: interactive option [1] configuration-generation regression. T11
      # only pipes "3" (Exit), so it never enters the config-generation path
      # and could not catch the bug where the interactive [1] branch inherits
      # choice's ERRORLEVEL (=1) into :write_config, which then misread the
      # inherited value as CONFIG_WRITE_FAILED. T16 pipes "1" through the REAL
      # interactive menu so the current control flow runs end to end: menu ->
      # choice /c 123 -> installation preflight (mocked to NONE in the COPY)
      # -> install1 -> :write_config. The COPY is also instrumented with a
      # `goto finish` replacing the unique DOWNLOAD stage marker, so a
      # successful config run stops before ensure_odt / network / install.
      # There is NO test seam in the production script.
      # ----------------------------------------------------------------------
      - name: T16 Interactive option [1] config generation
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\interactive1" >nul 2>nul
          mkdir "%ROOT%\interactive1\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\interactive1\officeDeploy.bat" >nul
          set "TEMP=%ROOT%\interactive1\temp"
          set "TMP=%ROOT%\interactive1\temp"

          :: Instrument the COPY (never the checked-in bat): stub only the
          :: read-only detector orchestration to return NONE, then replace the
          :: unique DOWNLOAD stage marker with `goto finish`. This makes the
          :: case deterministic even if a runner image later contains Office.
          powershell -NoProfile -Command "$f='%ROOT%\interactive1\officeDeploy.bat'; $q=[char]34; $nl=[char]13+[char]10; $download='set '+$q+'_stage=DOWNLOAD'+$q; $detect='call :detect_office_install_state'; $t=[IO.File]::ReadAllText($f); if(-not $t.Contains($download) -or -not $t.Contains($detect)){exit 1}; $t=$t.Replace($detect,'call :t16_detect_none').Replace($download,'goto finish'); $t=$t+$nl+':t16_detect_none'+$nl+'set _officeState=NONE'+$nl+'exit /b 0'+$nl; [IO.File]::WriteAllText($f,$t); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T16] FAIL: instrumentation anchor not found & exit /b 1 )

          :: Static guard: production bat must carry NO probe / test seam.
          findstr /c:"_T16B_PROBE" "officeDeploy.bat" >nul && ( echo [T16] FAIL: test seam present in production bat & exit /b 1 )
          findstr /c:"t16_detect_none" "officeDeploy.bat" >nul && ( echo [T16] FAIL: detector stub present in production bat & exit /b 1 )

          :: Pipe "1" through the interactive menu -> choice reads 1 -> [1] ->
          :: config generation. The trailing newline feeds the :finish pause.
          echo 1| call "%ROOT%\interactive1\officeDeploy.bat" > "%ROOT%\interactive1\run.out" 2>&1
          set "RC=!ERRORLEVEL!"

          :: MUST exit 0: with the fix, config generation succeeds and the
          :: injected goto finish returns SUCCESS. Without the fix, the
          :: inherited ERRORLEVEL=1 yields CONFIG_WRITE_FAILED -> exit 40.
          if not "!RC!"=="0" ( echo [T16] FAIL: expected exit 0, got !RC! & type "%ROOT%\interactive1\run.out" & exit /b 1 )

          :: Configuration.xml must exist in the script dir and be non-empty.
          if not exist "%ROOT%\interactive1\Configuration.xml" ( echo [T16] FAIL: Configuration.xml missing & type "%ROOT%\interactive1\run.out" & exit /b 1 )
          for %%A in ("%ROOT%\interactive1\Configuration.xml") do set "SZ=%%~zA"
          if !SZ! LEQ 0 ( echo [T16] FAIL: Configuration.xml empty & exit /b 1 )

          :: Positive: the config-generation banner actually ran.
          findstr /c:"No existing Office installation was detected." "%ROOT%\interactive1\run.out" >nul || ( echo [T16] FAIL: NONE preflight missing & type "%ROOT%\interactive1\run.out" & exit /b 1 )
          findstr /c:"Generating configuration file" "%ROOT%\interactive1\run.out" >nul || ( echo [T16] FAIL: config banner missing & type "%ROOT%\interactive1\run.out" & exit /b 1 )

          :: Negative: the bug signature MUST be absent.
          findstr /c:"CONFIG_WRITE_FAILED" "%ROOT%\interactive1\run.out" >nul && ( echo [T16] FAIL: CONFIG_WRITE_FAILED present & type "%ROOT%\interactive1\run.out" & exit /b 1 )
          findstr /c:"Configuration generation failed" "%ROOT%\interactive1\run.out" >nul && ( echo [T16] FAIL: failure message present & type "%ROOT%\interactive1\run.out" & exit /b 1 )

          :: Guards: must NOT have reached the download / install stages.
          findstr /c:"Downloading setup.exe from Microsoft CDN" "%ROOT%\interactive1\run.out" >nul && ( echo [T16] FAIL: reached ODT network download & exit /b 1 )
          if exist "%ROOT%\interactive1\setup.exe" ( echo [T16] FAIL: setup.exe leaked & exit /b 1 )
          if exist "%ROOT%\interactive1\setup.exe.download.tmp" ( echo [T16] FAIL: tmp leaked & exit /b 1 )

          echo [T16] PASS interactive-option-1-config-ok exit=0 no-config-failure no-network
          exit /b 0

      # ----------------------------------------------------------------------
      # T16b: ambient ERRORLEVEL contract for :write_config. Locks the fix so
      # :write_config's result depends ONLY on this run's config write, never
      # on an ERRORLEVEL inherited from a caller (choice leaving 1, or any
      # future caller). The COPY is instrumented with a T13-style dispatcher
      # (anchored on the unique first line) that, when _T16B_PROBE is set, sets
      # up the env :write_config needs, deliberately poisons the ambient error
      # level to 7 (cmd /d /c exit 7), then calls :write_config. It MUST still
      # succeed (exit 0) and emit a valid Configuration.xml. If anyone removes
      # the cmd /d /c exit 0 reset inside :write_config, the inherited 7 is
      # misread as CONFIG_WRITE_FAILED and this test fails immediately. No test
      # seam in production; the path is space-free so no literal " is needed
      # and no ! is used, keeping cmd quoting / delayed expansion safe.
      # ----------------------------------------------------------------------
      - name: T16b write_config ambient ERRORLEVEL contract
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\wc-contract" >nul 2>nul
          mkdir "%ROOT%\wc-contract\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\wc-contract\officeDeploy.bat" >nul
          set "TEMP=%ROOT%\wc-contract\temp"
          set "TMP=%ROOT%\wc-contract\temp"

          :: Static guard: production bat must carry NO probe flag.
          findstr /c:"_T16B_PROBE" "officeDeploy.bat" >nul && ( echo [T16b] FAIL: probe present in production bat & exit /b 1 )

          :: Instrument the COPY: a top-level dispatcher (anchored on the
          :: unique first-line masver assignment). When _T16B_PROBE is set it
          :: sets _cfg/_displayLevel/_mode, poisons ERRORLEVEL to 7, calls
          :: :write_config, and returns its exit code via goto :eof. Each
          :: statement is on its own line (no ^& / no parens), so the set
          :: values take no trailing space and cmd parsing stays simple. The
          :: path is space-free, so no literal " is needed inside $new.
          powershell -NoProfile -Command "$f='%ROOT%\wc-contract\officeDeploy.bat'; $t=[IO.File]::ReadAllText($f); $m=[regex]::Match($t,'\A@set masver=[0-9.]+'); if(-not $m.Success){exit 1}; $old=$m.Value; $new=\"@echo off`r`nsetlocal EnableExtensions EnableDelayedExpansion`r`nif not defined _T16B_PROBE goto :t16b_done`r`nset _cfg=%ROOT%\wc-contract\Configuration.xml`r`nset _displayLevel=None`r`nset _mode=interactive`r`ncmd /d /c exit 7`r`ncall :write_config`r`ngoto :eof`r`n:t16b_done`r`n\"+$old; $t=$new + $t.Substring($old.Length); [IO.File]::WriteAllText($f,$t); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T16b] FAIL: dispatcher injection failed & exit /b 1 )

          :: Drive the probe. goto :eof returns :write_config's exit code.
          set "_T16B_PROBE=1"
          call "%ROOT%\wc-contract\officeDeploy.bat" > "%ROOT%\wc-contract\out.txt" 2>&1
          set "RC=!ERRORLEVEL!"
          set "_T16B_PROBE="

          :: MUST exit 0: :write_config must succeed despite ambient ERRORLEVEL=7.
          if not "!RC!"=="0" ( echo [T16b] FAIL: expected exit 0, got !RC! & type "%ROOT%\wc-contract\out.txt" & exit /b 1 )
          :: The bug signature MUST be absent.
          findstr /c:"CONFIG_WRITE_FAILED" "%ROOT%\wc-contract\out.txt" >nul && ( echo [T16b] FAIL: CONFIG_WRITE_FAILED present & type "%ROOT%\wc-contract\out.txt" & exit /b 1 )

          :: Configuration.xml must exist and be non-empty.
          if not exist "%ROOT%\wc-contract\Configuration.xml" ( echo [T16b] FAIL: Configuration.xml missing & type "%ROOT%\wc-contract\out.txt" & exit /b 1 )
          for %%A in ("%ROOT%\wc-contract\Configuration.xml") do set "SZ=%%~zA"
          if !SZ! LEQ 0 ( echo [T16b] FAIL: Configuration.xml empty & exit /b 1 )

          echo [T16b] PASS write_config-ignores-ambient-errorlevel exit=0
          exit /b 0

      # ----------------------------------------------------------------------
      # T17: static activation-core contract. The full licensing diagnostics
      # are intentionally not executed by CI, so lock their exact production
      # ordering here: one early error reset, MAS preflight, shared Office
      # detection, Server detection, then the readiness gate. In particular,
      # no later reset may erase an error raised by :dk_errorcheck.
      # ----------------------------------------------------------------------
      - name: T17 Ohook preflight and readiness ordering
        shell: pwsh
        run: |
          $text = [IO.File]::ReadAllText((Join-Path $PWD 'officeDeploy.bat'))
          $match = [regex]::Match($text, '(?ms)^:oh_activate_core\r?\n.*?(?=^::  Activate Office 16\.0 C2R)')
          if (-not $match.Success) { throw '[T17] FAIL: core boundaries not found' }
          $core = $match.Value

          $ordered = @(
            'call :dk_setvar',
            'set "spp=SoftwareLicensingProduct"',
            'set "sps=SoftwareLicensingService"',
            'call :dk_reflection',
            'call :dk_ckeckwmic',
            'call :dk_product',
            'call :dk_sppissue',
            'set "error="',
            'call :dk_showosinfo',
            'set "_serv=%_slser% Winmgmt"',
            'set "notwinact=1"',
            'set "ohookact=1"',
            'call :dk_errorcheck',
            'call :oh_setspp',
            'call :oh_check_supported_office',
            'set "_supportedOfficeProbeExit=!ERRORLEVEL!"',
            'if not "!_supportedOfficeProbeExit!"=="0"',
            'if /i not "!_supportedProbeStatus!"=="SUPPORTED_PROBE_OK"',
            'call :oh_detect_windows_server',
            'call :oh_wait_licensing_ready'
          )
          $cursor = -1
          foreach ($needle in $ordered) {
            $next = $core.IndexOf($needle, $cursor + 1)
            if ($next -lt 0) { throw "[T17] FAIL: missing/out-of-order core line: $needle" }
            $cursor = $next
          }

          $resets = [regex]::Matches($core, '(?m)^set\s+"?error="?\r?$')
          if ($resets.Count -ne 1) { throw "[T17] FAIL: expected one core error reset, found $($resets.Count)" }
          $gate = [regex]::Match($core, '(?m)^call :oh_wait_licensing_ready\r?\nif errorlevel 1 exit /b 1\r?$')
          if (-not $gate.Success) { throw '[T17] FAIL: readiness call is not immediately followed by fail-closed abort' }
          if ($gate.Index -gt $core.IndexOf('call :oh_activate_o16c2r')) { throw '[T17] FAIL: readiness runs after product processing' }
          if ($text -notmatch '(?m)^:oh_detect_windows_server\r?$') { throw '[T17] FAIL: Server detector missing' }
          if ($text -notmatch '(?m)^:oh_wait_licensing_ready\r?$') { throw '[T17] FAIL: readiness gate missing' }
          if ($text -notmatch '(?m)^:oh_ensure_c2r_service_ready\r?$') { throw '[T17] FAIL: C2R service state helper missing' }
          if ($text -notmatch '(?m)^:oh_probe_licensing_provider\r?$') { throw '[T17] FAIL: provider probe missing' }
          if ($text -notmatch '(?m)^set "_ohReadyMax=12"\r?$') { throw '[T17] FAIL: 12-interval bound missing' }
          if ($text -notmatch '(?m)^%psc% "Start-Sleep -Seconds 5" %nul%\r?$') { throw '[T17] FAIL: five-second readiness interval missing' }
          if ($text -notmatch 'Invoke-WmiMethod -InputObject \$s -Name RefreshLicenseStatus') { throw '[T17] FAIL: explicit RefreshLicenseStatus invocation missing' }
          if ($text -notmatch '\[int\]\(\$r\.ReturnValue\) -ne 0') { throw '[T17] FAIL: RefreshLicenseStatus ReturnValue check missing' }
          Write-Host '[T17] PASS preflight-order single-error-reset server-detect strict-fail-closed readiness-gate'

      # ----------------------------------------------------------------------
      # T18: provider readiness runtime. This invokes only service/WMI
      # readiness checks and RefreshLicenseStatus; it never enters Ohook,
      # installs a key, or changes Office files. The positive path uses the
      # runner's real provider. The negative copy keeps the real provider query
      # but stubs the method result to ReturnValue=5.
      # ----------------------------------------------------------------------
      - name: T18 Licensing provider readiness and method result
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\readiness" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\readiness\officeDeploy.bat" >nul

          :: Production carries no CI dispatcher or configurable bypass.
          findstr /c:"_T18_PROBE" "officeDeploy.bat" >nul && ( echo [T18] FAIL: test seam present in production bat & exit /b 1 )

          :: Add a copied-script dispatcher. The positive path below runs the
          :: production 12-attempt timing and production helper code.
          powershell -NoProfile -Command "$f='%ROOT%\readiness\officeDeploy.bat'; $t=[IO.File]::ReadAllText($f); $m=[regex]::Match($t,'\A@set masver=[0-9.]+'); if(-not $m.Success){exit 1}; $old=$m.Value; $new=\"@echo off`r`nsetlocal EnableExtensions EnableDelayedExpansion`r`nif not defined _T18_PROBE goto :t18_done`r`ncall :dk_setvar`r`ncall :dk_ckeckwmic`r`ncall :oh_wait_licensing_ready`r`ngoto :eof`r`n:t18_done`r`n\"+$old; $t=$new+$t.Substring($old.Length); [IO.File]::WriteAllText($f,$t); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T18] FAIL: instrumentation failed & exit /b 1 )

          set "SysPath=%SystemRoot%\System32"
          set "nul1=1>nul"
          set "nul2=2>nul"
          set "nul6=2^>nul"
          set "nul=>nul 2>&1"
          set "sps=SoftwareLicensingService"
          set "_T18_PROBE=1"

          :: Positive path: the runner's real SPP, WMI, provider query, and
          :: refresh must all be ready. No C2R flag means no Office fixture is
          :: required for this provider-level contract.
          sc start sppsvc >nul 2>nul
          sc start Winmgmt >nul 2>nul
          set "o16c2r="
          set "o15c2r="
          call "%ROOT%\readiness\officeDeploy.bat" > "%ROOT%\readiness\ready.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T18a] FAIL: expected ready exit 0, got !RC! & type "%ROOT%\readiness\ready.out" & exit /b 1 )
          findstr /c:"Checking Software Protection            [Running]" "%ROOT%\readiness\ready.out" >nul || ( echo [T18a] FAIL: SPP ready line missing & type "%ROOT%\readiness\ready.out" & exit /b 1 )
          findstr /c:"Checking WMI                            [Ready]" "%ROOT%\readiness\ready.out" >nul || ( echo [T18a] FAIL: WMI ready line missing & type "%ROOT%\readiness\ready.out" & exit /b 1 )
          findstr /c:"Checking Licensing Provider             [Ready]" "%ROOT%\readiness\ready.out" >nul || ( echo [T18a] FAIL: provider ready line missing & type "%ROOT%\readiness\ready.out" & exit /b 1 )
          findstr /c:"Checking License Status Refresh         [Ready]" "%ROOT%\readiness\ready.out" >nul || ( echo [T18a] FAIL: refresh ready line missing & type "%ROOT%\readiness\ready.out" & exit /b 1 )
          echo [T18a] PASS real-spp-wmi-provider-refresh-ready

          :: Negative path: preserve the real Get-WmiObject provider query but
          :: replace only Invoke-WmiMethod's returned object in the COPY. The
          :: production ReturnValue check must classify non-zero as refresh
          :: failure. Max=0 removes waits from this deterministic fixture.
          powershell -NoProfile -Command "$f='%ROOT%\readiness\officeDeploy.bat'; $q=[char]34; $t=[IO.File]::ReadAllText($f); $max='set '+$q+'_ohReadyMax=12'+$q; $max0='set '+$q+'_ohReadyMax=0'+$q; $invoke='$r=Invoke-WmiMethod -InputObject $s -Name RefreshLicenseStatus -ErrorAction Stop'; $stub='$r=[pscustomobject]@{ReturnValue=5}'; if(-not $t.Contains($max) -or -not $t.Contains($invoke)){exit 1}; $t=$t.Replace($max,$max0).Replace($invoke,$stub); [IO.File]::WriteAllText($f,$t); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T18b] FAIL: ReturnValue fixture instrumentation failed & exit /b 1 )
          set "o16c2r="
          set "o15c2r="
          call "%ROOT%\readiness\officeDeploy.bat" > "%ROOT%\readiness\refresh-failed.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if "!RC!"=="0" ( echo [T18b] FAIL: non-zero ReturnValue passed readiness & type "%ROOT%\readiness\refresh-failed.out" & exit /b 1 )
          findstr /c:"Licensing readiness timed out." "%ROOT%\readiness\refresh-failed.out" >nul || ( echo [T18b] FAIL: timeout line missing & type "%ROOT%\readiness\refresh-failed.out" & exit /b 1 )
          findstr /c:"Component: RefreshLicenseStatus" "%ROOT%\readiness\refresh-failed.out" >nul || ( echo [T18b] FAIL: refresh component missing & type "%ROOT%\readiness\refresh-failed.out" & exit /b 1 )
          findstr /c:"Checking License Status Refresh         [Ready]" "%ROOT%\readiness\refresh-failed.out" >nul && ( echo [T18b] FAIL: false refresh-ready line & exit /b 1 )
          set "_T18_PROBE="
          echo [T18b] PASS provider-query-success refresh-returnvalue-5-fails
          exit /b 0

      # ----------------------------------------------------------------------
      # T18c: C2R service state machine. All service/provider behavior is
      # stubbed only in a copied bat, so the runner's real licensing state is
      # untouched. Covers missing, stopped-but-startable, unable-to-start, and
      # the Office 15 fallback where OfficeSvc is the available service.
      # ----------------------------------------------------------------------
      - name: T18c ClickToRun service readiness states
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'office-deploy-tests\c2r-states'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $copy = Join-Path $root 'officeDeploy.bat'
          Copy-Item -LiteralPath 'officeDeploy.bat' -Destination $copy -Force

          $text = [IO.File]::ReadAllText($copy)
          if ($text.Contains('_T18_STATE_PROBE')) { throw '[T18c] FAIL: test seam present in production bat' }
          $versionMatch = [regex]::Match($text, '\A@set masver=[0-9.]+')
          if (-not $versionMatch.Success) { throw '[T18c] FAIL: dispatcher anchor missing' }
          $old = $versionMatch.Value

          foreach ($anchor in @(
            'sc query %%S | find /i "RUNNING" %nul%',
            'sc query %%S %nul%',
            'sc start %%S %nul%',
            'sc query %_slser% | find /i "RUNNING" %nul%',
            'sc query Winmgmt | find /i "RUNNING" %nul%',
            'call :oh_probe_licensing_provider',
            'set "_ohReadyMax=12"',
            '%psc% "Start-Sleep -Seconds 5" %nul%'
          )) {
            if (-not $text.Contains($anchor)) { throw "[T18c] FAIL: instrumentation anchor missing: $anchor" }
          }

          $text = $text.Replace('sc query %%S | find /i "RUNNING" %nul%', 'call :t18_sc_running %%S')
          $text = $text.Replace('sc query %%S %nul%', 'call :t18_sc query %%S')
          $text = $text.Replace('sc start %%S %nul%', 'call :t18_sc start %%S')
          $text = $text.Replace('sc query %_slser% | find /i "RUNNING" %nul%', 'call :t18_sc_running %_slser%')
          $text = $text.Replace('sc query Winmgmt | find /i "RUNNING" %nul%', 'call :t18_sc_running Winmgmt')
          $text = $text.Replace('call :oh_probe_licensing_provider', 'call :t18_provider_ready')
          $text = $text.Replace('set "_ohReadyMax=12"', 'set "_ohReadyMax=1"')
          $text = $text.Replace('%psc% "Start-Sleep -Seconds 5" %nul%', 'rem T18c bounded retry without delay')

          $dispatcher = @'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not defined _T18_STATE_PROBE goto :t18_state_done
          call :dk_setvar
          call :dk_ckeckwmic
          call :oh_wait_licensing_ready
          set "_T18_RC=!errorlevel!"
          echo PROBE_START_COUNT=!_T18_START_COUNT!
          exit /b !_T18_RC!
          :t18_state_done
          '@

          $stub = @'
          :t18_provider_ready
          exit /b 0

          :t18_sc
          if /i "%~1"=="query" goto t18_sc_query
          if /i "%~1"=="start" goto t18_sc_start
          exit /b 87

          :t18_sc_query
          if /i "%~2"=="sppsvc" exit /b 0
          if /i "%~2"=="Winmgmt" exit /b 0
          if /i "!_T18_SCENARIO!"=="office15" (
              if /i "%~2"=="OfficeSvc" exit /b 0
              exit /b 1060
          )
          if /i "!_T18_SCENARIO!"=="missing" exit /b 1060
          exit /b 0

          :t18_sc_start
          set /a _T18_START_COUNT+=1
          if /i "!_T18_SCENARIO!"=="stopped_start" (
              set "_T18_STARTED=1"
              exit /b 0
          )
          exit /b 5

          :t18_sc_running
          if /i "%~1"=="sppsvc" exit /b 0
          if /i "%~1"=="Winmgmt" exit /b 0
          if /i "!_T18_SCENARIO!"=="office15" if /i "%~1"=="OfficeSvc" exit /b 0
          if /i "!_T18_SCENARIO!"=="stopped_start" if defined _T18_STARTED exit /b 0
          exit /b 1
          '@

          $nl = "`r`n"
          $dispatcher = [regex]::Replace($dispatcher, '\r?\n', $nl)
          $dispatcher = $dispatcher + $old + $nl
          $stub = [regex]::Replace($stub, '\r?\n', $nl)
          $text = $dispatcher + $text.Substring($old.Length) + $nl + $stub + $nl
          [IO.File]::WriteAllText($copy, $text)

          $env:SysPath = "$env:SystemRoot\System32"
          $env:nul1 = '1>nul'
          $env:nul2 = '2>nul'
          $env:nul6 = '2^>nul'
          $env:nul = '>nul 2>&1'
          $env:_T18_STATE_PROBE = '1'

          function Invoke-C2RState {
            param(
              [string]$Name,
              [bool]$Office16,
              [bool]$Office15,
              [int]$ExpectedExit,
              [string[]]$Required,
              [string[]]$Forbidden = @()
            )

            $env:_T18_SCENARIO = $Name
            $env:_T18_START_COUNT = '0'
            $env:_T18_STARTED = ''
            $env:o16c2r = $(if ($Office16) { '1' } else { '' })
            $env:o15c2r = $(if ($Office15) { '1' } else { '' })
            $out = Join-Path $root "$Name.out"
            $command = 'call "' + $copy + '" > "' + $out + '" 2>&1'
            & $env:ComSpec /d /c $command
            $rc = $LASTEXITCODE
            $actual = [IO.File]::ReadAllText($out)

            if ($rc -ne $ExpectedExit) {
              Write-Host $actual
              throw "[T18c:$Name] FAIL: expected exit $ExpectedExit, got $rc"
            }
            foreach ($needle in $Required) {
              if (-not $actual.Contains($needle)) {
                Write-Host $actual
                throw "[T18c:$Name] FAIL: required output missing: $needle"
              }
            }
            foreach ($needle in $Forbidden) {
              if ($actual.Contains($needle)) {
                Write-Host $actual
                throw "[T18c:$Name] FAIL: forbidden output found: $needle"
              }
            }
            Write-Host "[T18c:$Name] PASS"
          }

          Invoke-C2RState -Name 'missing' -Office16 $true -Office15 $false -ExpectedExit 1 `
            -Required @('Component: ClickToRunSvc (service not found)', 'PROBE_START_COUNT=0') `
            -Forbidden @('Checking Licensing Readiness')
          Invoke-C2RState -Name 'stopped_start' -Office16 $true -Office15 $false -ExpectedExit 0 `
            -Required @('Checking ClickToRun Service             [Running]', 'PROBE_START_COUNT=1') `
            -Forbidden @('Licensing readiness timed out.', 'Licensing readiness failed.')
          Invoke-C2RState -Name 'cannot_start' -Office16 $true -Office15 $false -ExpectedExit 1 `
            -Required @('Licensing readiness timed out.', 'Component: ClickToRunSvc', 'PROBE_START_COUNT=1') `
            -Forbidden @('Checking ClickToRun Service             [Running]')
          Invoke-C2RState -Name 'office15' -Office16 $false -Office15 $true -ExpectedExit 0 `
            -Required @('Checking ClickToRun Service             [Running]', 'PROBE_START_COUNT=0') `
            -Forbidden @('Licensing readiness timed out.', 'Licensing readiness failed.')

      # ----------------------------------------------------------------------
      # T19: real Server runner detection. The helper is called directly from
      # an instrumented copy and must establish winserver=1 on both matrix OSes.
      # ----------------------------------------------------------------------
      - name: T19 Windows Server detection
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\server-detect" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\server-detect\officeDeploy.bat" >nul
          findstr /c:"_T19_PROBE" "officeDeploy.bat" >nul && ( echo [T19] FAIL: test seam present in production bat & exit /b 1 )

          powershell -NoProfile -Command "$f='%ROOT%\server-detect\officeDeploy.bat'; $t=[IO.File]::ReadAllText($f); $m=[regex]::Match($t,'\A@set masver=[0-9.]+'); if(-not $m.Success){exit 1}; $old=$m.Value; $new=\"@echo off`r`nsetlocal EnableExtensions EnableDelayedExpansion`r`nif not defined _T19_PROBE goto :t19_done`r`ncall :oh_detect_windows_server`r`nif defined winserver (echo PROBE_winserver=1) else echo PROBE_winserver=`r`ngoto :eof`r`n:t19_done`r`n\"+$old; $t=$new+$t.Substring($old.Length); [IO.File]::WriteAllText($f,$t); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T19] FAIL: dispatcher injection failed & exit /b 1 )

          set "nul1=1>nul"
          set "nul2=2>nul"
          set "_T19_PROBE=1"
          call "%ROOT%\server-detect\officeDeploy.bat" > "%ROOT%\server-detect\out.txt" 2>&1
          set "RC=!ERRORLEVEL!"
          set "_T19_PROBE="
          if not "!RC!"=="0" ( echo [T19] FAIL: helper exit !RC! & type "%ROOT%\server-detect\out.txt" & exit /b 1 )
          findstr /x /c:"PROBE_winserver=1" "%ROOT%\server-detect\out.txt" >nul || ( echo [T19] FAIL: winserver flag missing & type "%ROOT%\server-detect\out.txt" & exit /b 1 )
          echo [T19] PASS real-runner-winserver=1
          exit /b 0

      # ----------------------------------------------------------------------
      # T20: activation-core fail-closed contract. Unlike helper-only tests,
      # this drives the real :oh_activate_core in a copied bat. Potentially
      # mutating diagnostics and Office detection are stubbed, readiness is
      # forced to fail, and every product/key/hook/cleanup marker must remain
      # unreachable.
      # ----------------------------------------------------------------------
      - name: T20 Activation core aborts on readiness failure
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'office-deploy-tests\core-readiness-fail'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $copy = Join-Path $root 'officeDeploy.bat'
          Copy-Item -LiteralPath 'officeDeploy.bat' -Destination $copy -Force
          $text = [IO.File]::ReadAllText($copy)
          if ($text.Contains('_T20_PROBE')) { throw '[T20] FAIL: test seam present in production bat' }

          $versionMatch = [regex]::Match($text, '\A@set masver=[0-9.]+')
          if (-not $versionMatch.Success) { throw '[T20] FAIL: dispatcher anchor missing' }
          $old = $versionMatch.Value
          foreach ($anchor in @(
            $old,
            'call :dk_sppissue',
            'call :dk_errorcheck',
            'call :oh_check_supported_office',
            'call :oh_wait_licensing_ready'
          )) {
            if (-not $text.Contains($anchor)) { throw "[T20] FAIL: instrumentation anchor missing: $anchor" }
          }

          $text = $text.Replace('call :dk_sppissue', 'rem T20 dk_sppissue stub')
          $text = $text.Replace('call :dk_errorcheck', 'rem T20 dk_errorcheck stub')
          $text = $text.Replace('call :oh_check_supported_office', "set `"o16c2r=1`"`r`nset `"_supportedProbeStatus=SUPPORTED_PROBE_OK`"`r`ncmd /d /c exit 0")
          $text = $text.Replace('call :oh_wait_licensing_ready', 'call :t20_readiness_fail')

          $dispatcher = @'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not defined _T20_PROBE goto :t20_done
          call :oh_activate_core
          exit /b !errorlevel!
          :t20_done
          '@
          $stub = @'
          :t20_readiness_fail
          echo T20_READINESS_FAILURE
          exit /b 1
          '@
          $nl = "`r`n"
          $dispatcher = [regex]::Replace($dispatcher, '\r?\n', $nl)
          $dispatcher = $dispatcher + $old + $nl
          $stub = [regex]::Replace($stub, '\r?\n', $nl)
          $text = $dispatcher + $text.Substring($old.Length) + $nl + $stub + $nl
          [IO.File]::WriteAllText($copy, $text)

          $env:SysPath = "$env:SystemRoot\System32"
          $env:nul1 = '1>nul'
          $env:nul2 = '2>nul'
          $env:nul6 = '2^>nul'
          $env:nul = '>nul 2>&1'
          $env:_T20_PROBE = '1'
          $out = Join-Path $root 'out.txt'
          $command = 'call "' + $copy + '" > "' + $out + '" 2>&1'
          & $env:ComSpec /d /c $command
          $rc = $LASTEXITCODE
          $actual = [IO.File]::ReadAllText($out)

          if ($rc -eq 0) {
            Write-Host $actual
            throw '[T20] FAIL: activation core returned success after readiness failure'
          }
          if (-not $actual.Contains('T20_READINESS_FAILURE')) {
            Write-Host $actual
            throw '[T20] FAIL: readiness failure stub was not reached'
          }
          foreach ($forbidden in @(
            'Activating Office...',
            'Installing Product Key',
            'Installing Generic Product Key',
            'Installing Ohook',
            'Clearing Office License Blocks',
            'Uninstalling Other/Grace Keys'
          )) {
            if ($actual.Contains($forbidden)) {
              Write-Host $actual
              throw "[T20] FAIL: mutation path reached after readiness failure: $forbidden"
            }
          }
          Write-Host "[T20] PASS core-readiness-failure rc=$rc abort-before-product-key-hook-cleanup"
          exit 0

      # ----------------------------------------------------------------------
      # T21: installation-preflight detector state machine. A copied bat gets
      # a dispatcher that calls only :detect_office_install_state. Registry,
      # marker-file, application-file, service, and detector-operational-error
      # fixtures are local to the runner. No menu, ODT, install, or activation
      # path runs.
      # ----------------------------------------------------------------------
      - name: T21 Installation preflight detector
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\install-preflight-detect" >nul 2>nul
          mkdir "%ROOT%\install-preflight-detect\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\install-preflight-detect\officeDeploy.bat" >nul
          set "TEMP=%ROOT%\install-preflight-detect\temp"
          set "TMP=%ROOT%\install-preflight-detect\temp"

          :: Inject a top-level dispatcher into the COPY. Literal ! characters
          :: are assembled inside PowerShell so this outer delayed-expansion
          :: block cannot consume the probe's runtime variable references.
          powershell -NoProfile -Command "$f='%ROOT%\install-preflight-detect\officeDeploy.bat'; $nl=[char]13+[char]10; $x=[char]33; $t=[IO.File]::ReadAllText($f); $m=[regex]::Match($t,'\A@set masver=[0-9.]+'); if(-not $m.Success){exit 1}; $old=$m.Value; $d='@echo off'+$nl+'setlocal EnableExtensions EnableDelayedExpansion'+$nl+'if not defined _T21_PROBE goto :t21_done'+$nl+'call :detect_office_install_state'+$nl+'set _t21rc='+$x+'errorlevel'+$x+$nl+'echo PROBE_OFFICE_STATE='+$x+'_officeState'+$x+$nl+'echo PROBE_TARGET_STATE='+$x+'_targetProbeState'+$x+$nl+'echo PROBE_TARGET_REASON='+$x+'_targetProbeReason'+$x+$nl+'echo PROBE_SUPPORTED_STATUS='+$x+'_supportedProbeResult'+$x+$nl+'exit /b '+$x+'_t21rc'+$x+$nl+':t21_done'+$nl+$old; $t=$d+$t.Substring($old.Length); [IO.File]::WriteAllText($f,$t); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T21] FAIL: dispatcher injection failed & exit /b 1 )
          findstr /c:"_T21_PROBE" "officeDeploy.bat" >nul && ( echo [T21] FAIL: test seam present in production bat & exit /b 1 )

          set "CLEAN_KEYS=HKLM\SOFTWARE\Microsoft\Office\ClickToRun HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\ClickToRun HKLM\SOFTWARE\Microsoft\Office\15.0\ClickToRun HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\15.0\ClickToRun HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\16.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\16.0\Common\InstallRoot HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\15.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\15.0\Common\InstallRoot HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\14.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\14.0\Common\InstallRoot"
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          for %%D in (T21Target T21MSI T21Broken) do rmdir /s /q "C:\%%D" >nul 2>nul
          sc delete ClickToRunSvc >nul 2>nul
          sc delete OfficeSvc >nul 2>nul
          set "_T21_PROBE=1"

          :: ---- T21a: no Office -> NONE ----
          call "%ROOT%\install-preflight-detect\officeDeploy.bat" > "%ROOT%\install-preflight-detect\a.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T21a] FAIL: detector exit !RC! & type "%ROOT%\install-preflight-detect\a.out" & exit /b 1 )
          findstr /x /c:"PROBE_OFFICE_STATE=NONE" "%ROOT%\install-preflight-detect\a.out" >nul || ( echo [T21a] FAIL: expected NONE & type "%ROOT%\install-preflight-detect\a.out" & exit /b 1 )
          findstr /x /c:"PROBE_TARGET_STATE=NO_TARGET" "%ROOT%\install-preflight-detect\a.out" >nul || ( echo [T21a] FAIL: expected NO_TARGET & type "%ROOT%\install-preflight-detect\a.out" & exit /b 1 )
          findstr /x /c:"PROBE_SUPPORTED_STATUS=SUPPORTED_PROBE_OK" "%ROOT%\install-preflight-detect\a.out" >nul || ( echo [T21a] FAIL: expected successful broad probe & exit /b 1 )
          echo [T21a] PASS no-office=NONE

          :: Shared healthy C2R fixture for T21b/c/d.
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f /v InstallPath /t REG_SZ /d "C:\T21Target" >nul || ( echo [T21] FAIL: C2R InstallPath fixture & exit /b 1 )
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun\Configuration" /f /v InstallationPath /t REG_SZ /d "C:\T21Target" >nul || exit /b 1
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun\Configuration" /f /v ProductReleaseIds /t REG_SZ /d "O365ProPlusRetail" >nul || exit /b 1
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun\Configuration" /f /v VersionToReport /t REG_SZ /d "16.0.19029.20184" >nul || exit /b 1
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun\Configuration" /f /v Platform /t REG_SZ /d "x64" >nul || exit /b 1
          mkdir "C:\T21Target\root\Office16" >nul 2>nul
          mkdir "C:\T21Target\root\Licenses16" >nul 2>nul
          for %%F in (WINWORD.EXE EXCEL.EXE POWERPNT.EXE) do echo dummy-app>"C:\T21Target\root\Office16\%%F"
          echo dummy-license>"C:\T21Target\root\Licenses16\ProPlusDummy.xrm-ms"
          sc create ClickToRunSvc binPath= "%SystemRoot%\system32\cmd.exe" >nul || ( echo [T21] FAIL: sc create ClickToRunSvc & exit /b 1 )

          :: ---- T21b: complete target x64 -> TARGET_INSTALLED ----
          call "%ROOT%\install-preflight-detect\officeDeploy.bat" > "%ROOT%\install-preflight-detect\b.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T21b] FAIL: detector exit !RC! & type "%ROOT%\install-preflight-detect\b.out" & exit /b 1 )
          findstr /x /c:"PROBE_OFFICE_STATE=TARGET_INSTALLED" "%ROOT%\install-preflight-detect\b.out" >nul || ( echo [T21b] FAIL: expected TARGET_INSTALLED & type "%ROOT%\install-preflight-detect\b.out" & exit /b 1 )
          findstr /x /c:"PROBE_TARGET_STATE=TARGET_INSTALLED" "%ROOT%\install-preflight-detect\b.out" >nul || ( echo [T21b] FAIL: exact target not installed & exit /b 1 )
          echo [T21b] PASS target-x64-complete=TARGET_INSTALLED

          :: ---- T21c: target product x86 -> OTHER_OFFICE, never target ----
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun\Configuration" /f /v Platform /t REG_SZ /d "x86" >nul || exit /b 1
          call "%ROOT%\install-preflight-detect\officeDeploy.bat" > "%ROOT%\install-preflight-detect\c.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T21c] FAIL: detector exit !RC! & type "%ROOT%\install-preflight-detect\c.out" & exit /b 1 )
          findstr /x /c:"PROBE_OFFICE_STATE=OTHER_OFFICE" "%ROOT%\install-preflight-detect\c.out" >nul || ( echo [T21c] FAIL: expected OTHER_OFFICE & type "%ROOT%\install-preflight-detect\c.out" & exit /b 1 )
          findstr /x /c:"PROBE_TARGET_STATE=TARGET_INCOMPLETE" "%ROOT%\install-preflight-detect\c.out" >nul || ( echo [T21c] FAIL: expected TARGET_INCOMPLETE & exit /b 1 )
          findstr /x /c:"PROBE_TARGET_REASON=PLATFORM" "%ROOT%\install-preflight-detect\c.out" >nul || ( echo [T21c] FAIL: platform reason missing & exit /b 1 )
          echo [T21c] PASS target-x86=OTHER_OFFICE

          :: ---- T21d: target x64 with WINWORD missing -> BROKEN_OFFICE ----
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun\Configuration" /f /v Platform /t REG_SZ /d "x64" >nul || exit /b 1
          del /q "C:\T21Target\root\Office16\WINWORD.EXE" >nul 2>nul
          call "%ROOT%\install-preflight-detect\officeDeploy.bat" > "%ROOT%\install-preflight-detect\d.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T21d] FAIL: detector exit !RC! & type "%ROOT%\install-preflight-detect\d.out" & exit /b 1 )
          findstr /x /c:"PROBE_OFFICE_STATE=BROKEN_OFFICE" "%ROOT%\install-preflight-detect\d.out" >nul || ( echo [T21d] FAIL: expected BROKEN_OFFICE & type "%ROOT%\install-preflight-detect\d.out" & exit /b 1 )
          findstr /x /c:"PROBE_TARGET_REASON=CORE_FILES" "%ROOT%\install-preflight-detect\d.out" >nul || ( echo [T21d] FAIL: core-files reason missing & exit /b 1 )
          echo [T21d] PASS target-missing-app=BROKEN_OFFICE

          :: ---- T21e: supported Office 16 MSI -> OTHER_OFFICE ----
          reg delete "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f >nul 2>nul
          reg add "HKLM\SOFTWARE\Microsoft\Office\16.0\Common\InstallRoot" /f /v Path /t REG_SZ /d "C:\T21MSI" >nul || exit /b 1
          mkdir "C:\T21MSI" >nul 2>nul
          echo dummy-picker>"C:\T21MSI\DummyPicker.dll"
          call "%ROOT%\install-preflight-detect\officeDeploy.bat" > "%ROOT%\install-preflight-detect\e.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T21e] FAIL: detector exit !RC! & type "%ROOT%\install-preflight-detect\e.out" & exit /b 1 )
          findstr /x /c:"PROBE_OFFICE_STATE=OTHER_OFFICE" "%ROOT%\install-preflight-detect\e.out" >nul || ( echo [T21e] FAIL: expected OTHER_OFFICE & type "%ROOT%\install-preflight-detect\e.out" & exit /b 1 )
          findstr /x /c:"PROBE_TARGET_STATE=NO_TARGET" "%ROOT%\install-preflight-detect\e.out" >nul || ( echo [T21e] FAIL: expected NO_TARGET & exit /b 1 )
          echo [T21e] PASS office16-msi=OTHER_OFFICE

          :: ---- T21f: C2R marker but service missing -> BROKEN_OFFICE ----
          reg delete "HKLM\SOFTWARE\Microsoft\Office\16.0\Common\InstallRoot" /f >nul 2>nul
          sc delete ClickToRunSvc >nul 2>nul
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f /v InstallPath /t REG_SZ /d "C:\T21Broken" >nul || exit /b 1
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun\Configuration" /f /v InstallationPath /t REG_SZ /d "C:\T21Broken" >nul || exit /b 1
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun\Configuration" /f /v ProductReleaseIds /t REG_SZ /d "VisioProRetail" >nul || exit /b 1
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun\Configuration" /f /v VersionToReport /t REG_SZ /d "16.0.19029.20184" >nul || exit /b 1
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun\Configuration" /f /v Platform /t REG_SZ /d "x64" >nul || exit /b 1
          mkdir "C:\T21Broken\root\Licenses16" >nul 2>nul
          echo dummy-license>"C:\T21Broken\root\Licenses16\ProPlusDummy.xrm-ms"
          call "%ROOT%\install-preflight-detect\officeDeploy.bat" > "%ROOT%\install-preflight-detect\f.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T21f] FAIL: detector exit !RC! & type "%ROOT%\install-preflight-detect\f.out" & exit /b 1 )
          findstr /x /c:"PROBE_OFFICE_STATE=BROKEN_OFFICE" "%ROOT%\install-preflight-detect\f.out" >nul || ( echo [T21f] FAIL: expected BROKEN_OFFICE & type "%ROOT%\install-preflight-detect\f.out" & exit /b 1 )
          findstr /c:"Not found, Office 16.0 files found" "%ROOT%\install-preflight-detect\f.out" >nul || ( echo [T21f] FAIL: broken-service evidence missing & exit /b 1 )
          findstr /x /c:"PROBE_SUPPORTED_STATUS=SUPPORTED_PROBE_OK" "%ROOT%\install-preflight-detect\f.out" >nul || ( echo [T21f] FAIL: service 1060 misclassified as operational error & exit /b 1 )
          echo [T21f] PASS missing-c2r-service=BROKEN_OFFICE

          :: ---- T21g: unavailable PowerShell -> DETECTION_ERROR ----
          reg delete "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f >nul 2>nul
          set "OLDPATH=!PATH!"
          set "PATH=C:\T21NoPath"
          call "%ROOT%\install-preflight-detect\officeDeploy.bat" > "%ROOT%\install-preflight-detect\g.out" 2>&1
          set "RC=!ERRORLEVEL!"
          set "PATH=!OLDPATH!"
          if "!RC!"=="0" ( echo [T21g] FAIL: detector unexpectedly succeeded & type "%ROOT%\install-preflight-detect\g.out" & exit /b 1 )
          findstr /x /c:"PROBE_OFFICE_STATE=DETECTION_ERROR" "%ROOT%\install-preflight-detect\g.out" >nul || ( echo [T21g] FAIL: expected DETECTION_ERROR & type "%ROOT%\install-preflight-detect\g.out" & exit /b 1 )
          findstr /x /c:"PROBE_TARGET_STATE=PROBE_ERROR" "%ROOT%\install-preflight-detect\g.out" >nul || ( echo [T21g] FAIL: expected PROBE_ERROR & exit /b 1 )
          echo [T21g] PASS powershell-unavailable=DETECTION_ERROR

          :: ---- T21h: broad detector operational failure -> DETECTION_ERROR ----
          :: Instrument only the COPY's explicit broad-registry health probe.
          :: The exact PowerShell target probe still runs normally and returns
          :: NO_TARGET; the failing broad channel must prevent NONE/install.
          powershell -NoProfile -Command "$f='%ROOT%\install-preflight-detect\officeDeploy.bat'; $q=[char]34; $p=[char]37; $old='reg query '+$q+'HKLM\SOFTWARE'+$q+' '+$p+'nul'+$p; $t=[IO.File]::ReadAllText($f); if(-not $t.Contains($old)){exit 1}; $t=$t.Replace($old,'cmd /d /c exit 9'); [IO.File]::WriteAllText($f,$t); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T21h] FAIL: broad-probe anchor not found & exit /b 1 )
          call "%ROOT%\install-preflight-detect\officeDeploy.bat" > "%ROOT%\install-preflight-detect\h.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if "!RC!"=="0" ( echo [T21h] FAIL: detector unexpectedly succeeded & type "%ROOT%\install-preflight-detect\h.out" & exit /b 1 )
          findstr /x /c:"PROBE_OFFICE_STATE=DETECTION_ERROR" "%ROOT%\install-preflight-detect\h.out" >nul || ( echo [T21h] FAIL: expected DETECTION_ERROR & type "%ROOT%\install-preflight-detect\h.out" & exit /b 1 )
          findstr /x /c:"PROBE_TARGET_STATE=NO_TARGET" "%ROOT%\install-preflight-detect\h.out" >nul || ( echo [T21h] FAIL: expected exact NO_TARGET & exit /b 1 )
          findstr /x /c:"PROBE_SUPPORTED_STATUS=SUPPORTED_PROBE_ERROR" "%ROOT%\install-preflight-detect\h.out" >nul || ( echo [T21h] FAIL: broad operational status missing & type "%ROOT%\install-preflight-detect\h.out" & exit /b 1 )
          echo [T21h] PASS broad-operational-failure=DETECTION_ERROR

          set "_T21_PROBE="
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          sc delete ClickToRunSvc >nul 2>nul
          sc delete OfficeSvc >nul 2>nul
          echo [T21] PASS detector-state-machine operational-fail-closed no-odt no-install no-activation
          exit /b 0

      # ----------------------------------------------------------------------
      # T22: real interactive option [1] control flow. Only the detector
      # orchestration is stubbed in a copied bat; the real menu, preflight UI,
      # install dispatch, and :write_config execute. DOWNLOAD is replaced with
      # `goto finish`, guaranteeing no network, ODT, Office, or activation.
      # ----------------------------------------------------------------------
      - name: T22 Interactive option [1] preflight control flow
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\install-preflight-flow" >nul 2>nul
          mkdir "%ROOT%\install-preflight-flow\base" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\install-preflight-flow\base\officeDeploy.bat" >nul

          :: Instrument the COPY with a deterministic state-only classifier
          :: stub and a DOWNLOAD stop. All interaction and config generation
          :: remain production code. Assemble literal ! inside PowerShell.
          powershell -NoProfile -Command "$f='%ROOT%\install-preflight-flow\base\officeDeploy.bat'; $nl=[char]13+[char]10; $x=[char]33; $q=[char]34; $t=[IO.File]::ReadAllText($f); $detect='call :detect_office_install_state'; $download='set '+$q+'_stage=DOWNLOAD'+$q; if(-not $t.Contains($detect) -or -not $t.Contains($download)){exit 1}; $t=$t.Replace($detect,'call :t22_detect_fixture').Replace($download,'goto finish'); $s=':t22_detect_fixture'+$nl+'set '+$q+'_officeState='+$x+'_T22_STATE'+$x+$q+$nl+'set '+$q+'_versionToReport=16.0.19029.20184'+$q+$nl+'set '+$q+'_platform=x64'+$q+$nl+'if /i '+$q+$x+'_officeState'+$x+$q+'=='+$q+'DETECTION_ERROR'+$q+' exit /b 1'+$nl+'exit /b 0'+$nl; [IO.File]::WriteAllText($f,$t+$nl+$s); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T22] FAIL: instrumentation failed & exit /b 1 )
          findstr /c:"_T22_STATE" "officeDeploy.bat" >nul && ( echo [T22] FAIL: test seam present in production bat & exit /b 1 )

          for %%C in (none target-return target-continue detection-error other-return other-continue broken-return broken-continue) do (
            mkdir "%ROOT%\install-preflight-flow\%%C" >nul 2>nul
            mkdir "%ROOT%\install-preflight-flow\%%C\temp" >nul 2>nul
            copy /y "%ROOT%\install-preflight-flow\base\officeDeploy.bat" "%ROOT%\install-preflight-flow\%%C\officeDeploy.bat" >nul
          )

          :: ---- T22a: NONE automatically continues into config generation ----
          set "TEMP=%ROOT%\install-preflight-flow\none\temp"
          set "TMP=!TEMP!"
          set "_T22_STATE=NONE"
          echo 1| call "%ROOT%\install-preflight-flow\none\officeDeploy.bat" > "%ROOT%\install-preflight-flow\none\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T22a] FAIL: expected exit 0, got !RC! & type "%ROOT%\install-preflight-flow\none\run.out" & exit /b 1 )
          if not exist "%ROOT%\install-preflight-flow\none\Configuration.xml" ( echo [T22a] FAIL: Configuration.xml missing & type "%ROOT%\install-preflight-flow\none\run.out" & exit /b 1 )
          findstr /c:"No existing Office installation was detected." "%ROOT%\install-preflight-flow\none\run.out" >nul || ( echo [T22a] FAIL: NONE message missing & exit /b 1 )
          echo [T22a] PASS none-auto-continues-to-config

          :: ---- T22b: TARGET_INSTALLED + Return never enters install1 ----
          set "TEMP=%ROOT%\install-preflight-flow\target-return\temp"
          set "TMP=!TEMP!"
          set "_T22_STATE=TARGET_INSTALLED"
          :: 1 = main Install, 1 = Return, 3 = main Exit; CR/LF feeds pause.
          echo 113| call "%ROOT%\install-preflight-flow\target-return\officeDeploy.bat" > "%ROOT%\install-preflight-flow\target-return\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T22b] FAIL: expected exit 0, got !RC! & type "%ROOT%\install-preflight-flow\target-return\run.out" & exit /b 1 )
          if exist "%ROOT%\install-preflight-flow\target-return\Configuration.xml" ( echo [T22b] FAIL: Configuration.xml created after Return & exit /b 1 )
          findstr /c:"Microsoft 365 Apps for enterprise is already installed." "%ROOT%\install-preflight-flow\target-return\run.out" >nul || ( echo [T22b] FAIL: target message missing & exit /b 1 )
          findstr /c:"Generating configuration file" "%ROOT%\install-preflight-flow\target-return\run.out" >nul && ( echo [T22b] FAIL: install1 reached after Return & exit /b 1 )
          echo [T22b] PASS target-return=no-config

          :: ---- T22c: TARGET_INSTALLED + Continue enters install1 ----
          set "TEMP=%ROOT%\install-preflight-flow\target-continue\temp"
          set "TMP=!TEMP!"
          set "_T22_STATE=TARGET_INSTALLED"
          :: 1 = main Install, 2 = Continue; CR/LF feeds pause after config.
          echo 12| call "%ROOT%\install-preflight-flow\target-continue\officeDeploy.bat" > "%ROOT%\install-preflight-flow\target-continue\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T22c] FAIL: expected exit 0, got !RC! & type "%ROOT%\install-preflight-flow\target-continue\run.out" & exit /b 1 )
          if not exist "%ROOT%\install-preflight-flow\target-continue\Configuration.xml" ( echo [T22c] FAIL: Configuration.xml missing & type "%ROOT%\install-preflight-flow\target-continue\run.out" & exit /b 1 )
          findstr /c:"Generating configuration file" "%ROOT%\install-preflight-flow\target-continue\run.out" >nul || ( echo [T22c] FAIL: install1 not reached & exit /b 1 )
          echo [T22c] PASS target-continue=config-created

          :: ---- T22d: any exact/broad DETECTION_ERROR never enters install1 ----
          set "TEMP=%ROOT%\install-preflight-flow\detection-error\temp"
          set "TMP=!TEMP!"
          set "_T22_STATE=DETECTION_ERROR"
          :: 1 = main Install, 3 = Exit from the detection-error menu.
          echo 13| call "%ROOT%\install-preflight-flow\detection-error\officeDeploy.bat" > "%ROOT%\install-preflight-flow\detection-error\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T22d] FAIL: expected user-exit 0, got !RC! & type "%ROOT%\install-preflight-flow\detection-error\run.out" & exit /b 1 )
          if exist "%ROOT%\install-preflight-flow\detection-error\Configuration.xml" ( echo [T22d] FAIL: Configuration.xml created after detection failure & exit /b 1 )
          findstr /c:"Office installation detection failed." "%ROOT%\install-preflight-flow\detection-error\run.out" >nul || ( echo [T22d] FAIL: failure message missing & exit /b 1 )
          findstr /c:"Installation has not started." "%ROOT%\install-preflight-flow\detection-error\run.out" >nul || ( echo [T22d] FAIL: fail-closed message missing & exit /b 1 )
          findstr /c:"Generating configuration file" "%ROOT%\install-preflight-flow\detection-error\run.out" >nul && ( echo [T22d] FAIL: silently entered install1 & exit /b 1 )
          echo [T22d] PASS detection-error=fail-closed-no-config

          :: ---- T22e: OTHER_OFFICE + Return never enters install1 ----
          set "TEMP=%ROOT%\install-preflight-flow\other-return\temp"
          set "TMP=!TEMP!"
          set "_T22_STATE=OTHER_OFFICE"
          :: 1 = main Install, 2 = Return, 3 = main Exit; CR/LF feeds pause.
          echo 123| call "%ROOT%\install-preflight-flow\other-return\officeDeploy.bat" > "%ROOT%\install-preflight-flow\other-return\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T22e] FAIL: expected exit 0, got !RC! & type "%ROOT%\install-preflight-flow\other-return\run.out" & exit /b 1 )
          if exist "%ROOT%\install-preflight-flow\other-return\Configuration.xml" ( echo [T22e] FAIL: Configuration.xml created after Return & exit /b 1 )
          findstr /c:"An existing Microsoft Office installation was detected," "%ROOT%\install-preflight-flow\other-return\run.out" >nul || ( echo [T22e] FAIL: OTHER_OFFICE message missing & exit /b 1 )
          findstr /c:"Generating configuration file" "%ROOT%\install-preflight-flow\other-return\run.out" >nul && ( echo [T22e] FAIL: install1 reached after Return & exit /b 1 )
          echo [T22e] PASS other-office-return=no-config

          :: ---- T22f: OTHER_OFFICE + Continue enters install1 ----
          set "TEMP=%ROOT%\install-preflight-flow\other-continue\temp"
          set "TMP=!TEMP!"
          set "_T22_STATE=OTHER_OFFICE"
          :: 1 = main Install, 1 = Continue; CR/LF feeds pause after config.
          echo 11| call "%ROOT%\install-preflight-flow\other-continue\officeDeploy.bat" > "%ROOT%\install-preflight-flow\other-continue\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T22f] FAIL: expected exit 0, got !RC! & type "%ROOT%\install-preflight-flow\other-continue\run.out" & exit /b 1 )
          if not exist "%ROOT%\install-preflight-flow\other-continue\Configuration.xml" ( echo [T22f] FAIL: Configuration.xml missing & type "%ROOT%\install-preflight-flow\other-continue\run.out" & exit /b 1 )
          findstr /c:"An existing Microsoft Office installation was detected," "%ROOT%\install-preflight-flow\other-continue\run.out" >nul || ( echo [T22f] FAIL: OTHER_OFFICE message missing & exit /b 1 )
          findstr /c:"Generating configuration file" "%ROOT%\install-preflight-flow\other-continue\run.out" >nul || ( echo [T22f] FAIL: install1 not reached & exit /b 1 )
          echo [T22f] PASS other-office-continue=config-created

          :: ---- T22g: BROKEN_OFFICE + Return never enters install1 ----
          set "TEMP=%ROOT%\install-preflight-flow\broken-return\temp"
          set "TMP=!TEMP!"
          set "_T22_STATE=BROKEN_OFFICE"
          :: 1 = main Install, 2 = Return, 3 = main Exit; CR/LF feeds pause.
          echo 123| call "%ROOT%\install-preflight-flow\broken-return\officeDeploy.bat" > "%ROOT%\install-preflight-flow\broken-return\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T22g] FAIL: expected exit 0, got !RC! & type "%ROOT%\install-preflight-flow\broken-return\run.out" & exit /b 1 )
          if exist "%ROOT%\install-preflight-flow\broken-return\Configuration.xml" ( echo [T22g] FAIL: Configuration.xml created after Return & exit /b 1 )
          findstr /c:"An incomplete or broken Microsoft Office installation was detected." "%ROOT%\install-preflight-flow\broken-return\run.out" >nul || ( echo [T22g] FAIL: BROKEN_OFFICE message missing & exit /b 1 )
          findstr /c:"Generating configuration file" "%ROOT%\install-preflight-flow\broken-return\run.out" >nul && ( echo [T22g] FAIL: install1 reached after Return & exit /b 1 )
          echo [T22g] PASS broken-office-return=no-config

          :: ---- T22h: BROKEN_OFFICE + Continue enters install1 ----
          set "TEMP=%ROOT%\install-preflight-flow\broken-continue\temp"
          set "TMP=!TEMP!"
          set "_T22_STATE=BROKEN_OFFICE"
          :: 1 = main Install, 1 = Continue; CR/LF feeds pause after config.
          echo 11| call "%ROOT%\install-preflight-flow\broken-continue\officeDeploy.bat" > "%ROOT%\install-preflight-flow\broken-continue\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T22h] FAIL: expected exit 0, got !RC! & type "%ROOT%\install-preflight-flow\broken-continue\run.out" & exit /b 1 )
          if not exist "%ROOT%\install-preflight-flow\broken-continue\Configuration.xml" ( echo [T22h] FAIL: Configuration.xml missing & type "%ROOT%\install-preflight-flow\broken-continue\run.out" & exit /b 1 )
          findstr /c:"An incomplete or broken Microsoft Office installation was detected." "%ROOT%\install-preflight-flow\broken-continue\run.out" >nul || ( echo [T22h] FAIL: BROKEN_OFFICE message missing & exit /b 1 )
          findstr /c:"Generating configuration file" "%ROOT%\install-preflight-flow\broken-continue\run.out" >nul || ( echo [T22h] FAIL: install1 not reached & exit /b 1 )
          echo [T22h] PASS broken-office-continue=config-created

          :: Global safety assertions across every real option [1] scenario.
          for %%C in (none target-return target-continue detection-error other-return other-continue broken-return broken-continue) do (
            findstr /c:"Downloading setup.exe from Microsoft CDN" "%ROOT%\install-preflight-flow\%%C\run.out" >nul && ( echo [T22] FAIL: %%C reached network download & exit /b 1 )
            if exist "%ROOT%\install-preflight-flow\%%C\setup.exe" ( echo [T22] FAIL: %%C setup.exe leaked & exit /b 1 )
            if exist "%ROOT%\install-preflight-flow\%%C\setup.exe.download.tmp" ( echo [T22] FAIL: %%C temp download leaked & exit /b 1 )
          )
          set "_T22_STATE="
          echo [T22] PASS all-five-states real-option-1-preflight no-network no-install no-activation
          exit /b 0

      # ----------------------------------------------------------------------
      # T23: static MAS 3.12 synchronization and Office Deploy integration
      # contract. This reads production text only and performs no mutation.
      # ----------------------------------------------------------------------
      - name: T23 Ohook 3.12 static synchronization contract
        shell: pwsh
        run: |
          $text = [IO.File]::ReadAllText((Join-Path $PWD 'officeDeploy.bat'))

          function Assert-Contains([string]$Haystack, [string]$Needle, [string]$Message) {
            if (-not $Haystack.Contains($Needle)) { throw "[T23] FAIL: $Message" }
          }

          function Assert-Ordered([string]$Haystack, [string[]]$Needles) {
            $position = 0
            foreach ($needle in $Needles) {
              $next = $Haystack.IndexOf($needle, $position, [StringComparison]::Ordinal)
              if ($next -lt 0) { throw "[T23] FAIL: missing/out-of-order core line: $needle" }
              $position = $next + $needle.Length
            }
          }

          if ($text -notmatch '\A@set masver=3\.12\r?\n') { throw '[T23] FAIL: masver is not 3.12' }

          foreach ($forbidden in @(
            'set exhook=',
            '\BIN\%_hook%',
            'Copying Custom sppc',
            'Copying Custom %_hook%',
            'GetRandomFileName'
          )) {
            if ($text.Contains($forbidden)) { throw "[T23] FAIL: removed Ohook 3.10 path remains: $forbidden" }
          }

          $extractMatch = [regex]::Match($text, '(?ms)^:oh_extractdll\r?\n.*?(?=^:hexedit:\r?$)')
          if (-not $extractMatch.Success) { throw '[T23] FAIL: oh_extractdll boundaries not found' }
          $extract = $extractMatch.Value
          Assert-Contains $extract '[IO.File]::ReadAllText' 'oh_extractdll is not using [IO.File]'
          if ($extract.Contains('[System.IO.File]')) { throw '[T23] FAIL: old fully qualified file API remains in oh_extractdll' }

          $hexMatch = [regex]::Match($text, '(?ms)^:hexedit:\r?\n.*?^:hexedit:\r?$')
          if (-not $hexMatch.Success) { throw '[T23] FAIL: hexedit boundaries not found' }
          $hexedit = $hexMatch.Value
          Assert-Contains $hexedit '[Guid]::NewGuid().Guid' 'hexedit GUID temporary name missing'
          Assert-Contains $hexedit '[IO.File]::WriteAllBytes' 'hexedit is not using [IO.File]'
          Assert-Contains $hexedit 'finally {' 'temporary PE cleanup hardening missing'

          Assert-Contains $text '09865ea5993215965e8f27a74b8a41d15fd0f60f5f404cb7a8b3c7757acdab02 *sppc32.dll' 'sppc32 payload hash comment missing'
          Assert-Contains $text '393a1fa26deb3663854e41f2b687c188a9eacd87b23f17ea09422c4715cb5a9f *sppc64.dll' 'sppc64 payload hash comment missing'
          Assert-Contains $text ':oh_check_supported_office' 'supported Office detector missing'
          Assert-Contains $text ':oh_wait_licensing_ready' 'licensing readiness helper missing'
          Assert-Contains $text 'Upstream file commit: f34d025d5102a790c75c839c8d46b672284729a5' 'upstream commit provenance missing'
          Assert-Contains $text 'Upstream file blob: cec64c62a39cb61254bf5d39091f399b6d1d4de7' 'upstream blob provenance missing'

          foreach ($seam in @(
            '_T12E_PROBE', '_T13_RUN_CORE', '_T16B_PROBE', '_T18_PROBE',
            '_T18_STATE_PROBE', '_T19_PROBE', '_T20_PROBE', '_T21_PROBE',
            '_T22_STATE', '_T23_PROBE', '_T24_PROBE'
          )) {
            if ($text.Contains($seam)) { throw "[T23] FAIL: CI-only seam present in production bat: $seam" }
          }

          $coreMatch = [regex]::Match($text, '(?ms)^:oh_activate_core\r?\n.*?(?=^::  Activate Office 16\.0 C2R)')
          if (-not $coreMatch.Success) { throw '[T23] FAIL: activation core boundaries not found' }
          $core = $coreMatch.Value
          Assert-Ordered $core @(
            'set "error="',
            'call :dk_errorcheck',
            'call :oh_setspp',
            'call :oh_check_supported_office',
            'call :oh_detect_windows_server',
            'call :oh_wait_licensing_ready',
            'call :oh_activate_o16c2r',
            'call :oh_activate_o15c2r',
            'call :oh_processmsi',
            'call :oh_clearblock',
            'call :oh_uninstkey',
            'call :oh_licrefresh'
          )
          Assert-Contains $core 'if /i not "!_supportedProbeStatus!"=="SUPPORTED_PROBE_OK"' 'supported detector status guard missing'
          Assert-Contains $core 'if errorlevel 1 exit /b 1' 'readiness fail-closed abort missing'

          $keyMatch = [regex]::Match($text, '(?ms)^:dk_inskey\r?\n.*?(?=^::  Get all products Activation IDs)')
          if (-not $keyMatch.Success) { throw '[T23] FAIL: dk_inskey boundaries not found' }
          $keyInstall = $keyMatch.Value
          Assert-Contains $keyInstall 'set "_keytail=%key:~-5%"' 'repeat-run key-tail guard missing'
          Assert-Contains $keyInstall 'wmic path %spp% get PartialProductKey /VALUE' 'WMIC installed-key enumeration missing'
          Assert-Contains $keyInstall "SELECT PartialProductKey FROM %spp% WHERE PartialProductKey IS NOT NULL" 'PowerShell installed-key enumeration missing'
          Assert-Ordered $keyInstall @(
            'set "_keyalready="',
            'PartialProductKey',
            'if defined _keyalready (',
            'InstallProductKey'
          )
          Assert-Contains $keyInstall '[Already installed]' 'repeat-run already-installed success result missing'

          Write-Host '[T23] PASS mas-3.12 no-exhook io-file guid-temp payload-comments local-guards ordered-core repeat-key-guard no-ci-seam'

      # ----------------------------------------------------------------------
      # T24: decode both embedded payloads, then call the real :oh_extractdll
      # label in an instrumented copy. Only runner-temp PE files are touched.
      # ----------------------------------------------------------------------
      - name: T24 Embedded Ohook payload extraction
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'office-deploy-tests\ohook-payload'
          $copy = Join-Path $root 'officeDeploy.bat'
          $out32 = Join-Path $root 'sppc32.dll'
          $out64 = Join-Path $root 'sppc64.dll'
          $manifest = Join-Path $root 'hexedit-temp-paths.txt'
          $bin = Join-Path $root 'BIN'

          function Get-Sha256([byte[]]$Bytes) {
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              return -join ($sha.ComputeHash($Bytes) | ForEach-Object { $_.ToString('x2') })
            } finally {
              $sha.Dispose()
            }
          }

          function Get-EmbeddedPayload([string]$Text, [string]$Name) {
            $escaped = [regex]::Escape($Name)
            $match = [regex]::Match($Text, "(?ms)^:${escaped}:\r?\n(.*?)^:${escaped}:\r?$")
            if (-not $match.Success) { throw "[T24] FAIL: payload boundaries missing for $Name" }
            $encoded = ($match.Groups[1].Value -replace '-', 'A' -replace '_', 'a') -replace '\s', ''
            try {
              return [Convert]::FromBase64String($encoded)
            } catch {
              throw "[T24] FAIL: invalid embedded Base64 for ${Name}: $($_.Exception.Message)"
            }
          }

          function Assert-Pe([string]$Path, [int]$ExpectedMachine) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "[T24] FAIL: output missing: $Path" }
            $bytes = [IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "[T24] FAIL: MZ header missing: $Path" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0x40 -or ($peOffset + 6) -gt $bytes.Length) { throw "[T24] FAIL: invalid PE offset: $Path" }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) { throw "[T24] FAIL: PE signature missing: $Path" }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne $ExpectedMachine) { throw "[T24] FAIL: unexpected PE machine 0x$($machine.ToString('x4')): $Path" }

            [int]$headerSum = 0
            [int]$checkSum = 0
            $result = [T24ImageHlp]::MapFileAndCheckSum($Path, [ref]$headerSum, [ref]$checkSum)
            if ($result -ne 0) { throw "[T24] FAIL: MapFileAndCheckSum returned $result for $Path" }
            if ($headerSum -ne $checkSum) { throw "[T24] FAIL: PE checksum mismatch for $Path (header=$headerSum computed=$checkSum)" }
          }

          Add-Type @'
          using System.Runtime.InteropServices;
          public static class T24ImageHlp {
              [DllImport("imagehlp.dll", CharSet = CharSet.Auto)]
              public static extern int MapFileAndCheckSum(string filename, out int headerSum, out int checkSum);
          }
          '@

          New-Item -ItemType Directory -Force -Path $root | Out-Null
          try {
            Copy-Item -LiteralPath 'officeDeploy.bat' -Destination $copy -Force
            if (Test-Path -LiteralPath $bin) { throw '[T24] FAIL: BIN exists before extraction' }

            $text = [IO.File]::ReadAllText($copy)
            $expected = @{
              'sppc32.dll' = '09865ea5993215965e8f27a74b8a41d15fd0f60f5f404cb7a8b3c7757acdab02'
              'sppc64.dll' = '393a1fa26deb3663854e41f2b687c188a9eacd87b23f17ea09422c4715cb5a9f'
            }
            foreach ($name in $expected.Keys) {
              $payload = Get-EmbeddedPayload $text $name
              if ($payload.Length -ne 9216) { throw "[T24] FAIL: unexpected raw payload length for ${name}: $($payload.Length)" }
              $actualHash = Get-Sha256 $payload
              if ($actualHash -ne $expected[$name]) { throw "[T24] FAIL: raw payload hash mismatch for ${name}: $actualHash" }
            }

            $versionMatch = [regex]::Match($text, '\A@set masver=[0-9.]+')
            if (-not $versionMatch.Success) { throw '[T24] FAIL: dispatcher anchor missing' }
            $versionLine = $versionMatch.Value
            $nl = "`r`n"

            # Instrument only the copied BAT to record each GUID temporary PE
            # path. The real hexedit cleanup still creates and removes the file.
            $tempPathAnchor = '$tempFilePath = "$env:windir\Temp\$([Guid]::NewGuid().Guid)"'
            $tempPathAnchorCount = ([regex]::Matches($text, [regex]::Escape($tempPathAnchor))).Count
            if ($tempPathAnchorCount -ne 1) { throw "[T24] FAIL: expected one GUID temp-path anchor, found $tempPathAnchorCount" }
            $tempPathRecorder = '[IO.File]::AppendAllText($env:_T24_TEMP_MANIFEST, $tempFilePath + [Environment]::NewLine)'
            $text = $text.Replace($tempPathAnchor, $tempPathAnchor + $nl + $tempPathRecorder)
          $dispatcher = @'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not defined _T24_PROBE goto :t24_done
          set "SysPath=%SystemRoot%\System32"
          set "psc=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -Command"
          set "nul1=1>nul"
          set "nul2=2>nul"
          set "_batp=%~f0"
          set "_batp=!_batp:'=''!"
          set "hasherror="
          set "_hook=sppc32.dll"
          call :oh_extractdll "%_T24_OUT32%" "2564"
          set "_hook=sppc64.dll"
          call :oh_extractdll "%_T24_OUT64%" "3076"
          if defined hasherror exit /b 1
          if not exist "%_T24_OUT32%" exit /b 1
          if not exist "%_T24_OUT64%" exit /b 1
          exit /b 0
          :t24_done
          '@
            $dispatcher = [regex]::Replace($dispatcher, '\r?\n', $nl) + $versionLine + $nl
            $text = $dispatcher + $text.Substring($versionLine.Length)
            [IO.File]::WriteAllText($copy, $text)

            $env:_T24_PROBE = '1'
            $env:_T24_OUT32 = $out32
            $env:_T24_OUT64 = $out64
            $env:_T24_TEMP_MANIFEST = $manifest
            $command = 'call "' + $copy + '"'
            & $env:ComSpec /d /c $command
            $rc = $LASTEXITCODE
            if ($rc -ne 0) { throw "[T24] FAIL: oh_extractdll dispatcher returned $rc" }

            Assert-Pe $out32 0x014c
            Assert-Pe $out64 0x8664
            if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw '[T24] FAIL: GUID temporary PE manifest missing' }
            $tempPaths = @(Get-Content -LiteralPath $manifest | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($tempPaths.Count -ne 2) { throw "[T24] FAIL: expected two GUID temporary PE paths, found $($tempPaths.Count)" }
            $uniqueTempPaths = @($tempPaths | Sort-Object -Unique)
            if ($uniqueTempPaths.Count -ne 2) { throw '[T24] FAIL: GUID temporary PE paths were not unique' }
            $expectedTempDir = [IO.Path]::GetFullPath((Join-Path $env:windir 'Temp')).TrimEnd([IO.Path]::DirectorySeparatorChar)
            foreach ($tempPath in $uniqueTempPaths) {
              $tempDir = [IO.Path]::GetDirectoryName($tempPath).TrimEnd([IO.Path]::DirectorySeparatorChar)
              $tempName = [IO.Path]::GetFileName($tempPath)
              if (-not [string]::Equals($tempDir, $expectedTempDir, [StringComparison]::OrdinalIgnoreCase)) { throw "[T24] FAIL: temporary PE was outside Windows Temp: $tempPath" }
              if ($tempName -notmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') { throw "[T24] FAIL: temporary PE name was not a GUID: $tempName" }
              if (Test-Path -LiteralPath $tempPath) { throw "[T24] FAIL: GUID temporary PE was not removed: $tempPath" }
            }
            if (Test-Path -LiteralPath $bin) { throw '[T24] FAIL: extraction created or used a BIN directory' }

            Write-Host '[T24] PASS raw-hashes actual-extract mz-pe checksum guid-temp-cleanup no-bin no-activation'
          } finally {
            Remove-Item Env:_T24_PROBE -ErrorAction SilentlyContinue
            Remove-Item Env:_T24_OUT32 -ErrorAction SilentlyContinue
            Remove-Item Env:_T24_OUT64 -ErrorAction SilentlyContinue
            Remove-Item Env:_T24_TEMP_MANIFEST -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload runtime-contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contract-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/office-deploy-tests/**
            ${{ runner.temp }}/Office Deploy Runtime/**
          if-no-files-found: warn
          retention-days: 7

  wow64-relaunch:
    name: WOW64 -> Sysnative (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ----------------------------------------------------------------------
      # T10: launch officeDeploy.bat from a real 32-bit CMD
      # (%SystemRoot%\SysWOW64\cmd.exe) on the x64 runner, force the
      # Sysnative native relaunch, and verify the native child exit code
      # propagates to the outermost ERRORLEVEL reported to our wrapper.
      # Same fixture as T9, so the native child also exits 31.
      # ----------------------------------------------------------------------
      - name: T10 WOW64 -> Sysnative relaunch
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\wow64" >nul 2>nul
          mkdir "%ROOT%\wow64\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\wow64\officeDeploy.bat" >nul

          :: Same fault-injection fixture as T9.
          echo this-is-not-a-valid-odt-setup-exe > "%ROOT%\wow64\setup.exe"
          mkdir "%ROOT%\wow64\setup.exe.download.tmp" >nul

          set "TEMP=%ROOT%\wow64\temp"
          set "TMP=%ROOT%\wow64\temp"

          :: Sanity: the runner must expose a real 32-bit CMD. (SysWOW64 is
          :: visible from this 64-bit wrapper CMD.) Note we deliberately do
          :: NOT preflight Sysnative here: %SystemRoot%\Sysnative is a virtual
          :: alias only visible to 32-bit (WOW64) processes, so it is absent
          :: from this 64-bit wrapper. officeDeploy.bat checks it from inside
          :: the 32-bit process where it is resolvable; the proof that the
          :: native relaunch actually happened is the NATIVE_RELAUNCH=1 marker
          :: in the native-child log plus the propagated outermost exit code.
          if not exist "%SystemRoot%\SysWOW64\cmd.exe" ( echo [T10] FAIL: SysWOW64\cmd.exe missing & exit /b 1 )

          :: To avoid fragile nested-quote parsing across two layers of cmd,
          :: generate a tiny wrapper bat and let the 32-bit CMD run it. The
          :: wrapper path is space-free, so "cmd /c wrapper" quoting is trivial.
          > "%ROOT%\wow64\inner.cmd" echo @echo off
          >> "%ROOT%\wow64\inner.cmd" echo call "%ROOT%\wow64\officeDeploy.bat" --unattended ^> "%ROOT%\wow64\run.out" 2^>^&1

          :: Launch from a genuine 32-bit CMD. The script detects Sysnative
          :: and relaunches itself natively; the native child exits 31 and
          :: that must propagate to the outermost level we observe here.
          "%SystemRoot%\SysWOW64\cmd.exe" /d /c "%ROOT%\wow64\inner.cmd"
          set "RC=!ERRORLEVEL!"

          if not "!RC!"=="31" (
            echo [T10] FAIL: expected outermost exit 31, got !RC!
            type "%ROOT%\wow64\run.out"
            exit /b 1
          )

          :: Guard: no real ODT download and no Office install reached.
          findstr /c:"Downloading setup.exe from Microsoft CDN" "%ROOT%\wow64\run.out" >nul && (
            echo [T10] FAIL: reached ODT network download
            exit /b 1
          )
          findstr /c:"STAGE=INSTALL" "%ROOT%\wow64\run.out" >nul && (
            echo [T10] FAIL: reached Office install stage
            exit /b 1
          )

          :: The final unattended log is written by the native child, so it
          :: must carry NATIVE_RELAUNCH=1 alongside EXIT_CODE=31.
          set "LOG=%TEMP%\office-deploy\office-deploy.log"
          if not exist "%LOG%" ( echo [T10] FAIL: native child log missing & exit /b 1 )
          findstr /c:"NATIVE_RELAUNCH=1" "%LOG%" >nul || ( echo [T10] FAIL: no NATIVE_RELAUNCH=1 in log & exit /b 1 )
          findstr /c:"EXIT_CODE=31" "%LOG%" >nul || ( echo [T10] FAIL: no EXIT_CODE=31 in log & exit /b 1 )

          :: Native child parsed --unattended AND re1 (two shift /1). Assert
          :: its SCRIPT_PATH EQUALS the BAT path exactly. This proves %0
          :: survives multiple shifts in the relaunched child and is the most
          :: precise lock for the bare-shift root cause. Case-insensitive
          :: compare tolerates drive-letter/case variance.
          set "SP_LINE="
          for /f "usebackq tokens=1,* delims==" %%A in ("%LOG%") do (
            if "%%A"=="[office-deploy] SCRIPT_PATH" set "SP_LINE=%%B"
          )
          if not defined SP_LINE ( echo [T10] FAIL: native child SCRIPT_PATH line absent & exit /b 1 )
          set "EXPECTED=%ROOT%\wow64\officeDeploy.bat"
          if /i not "!SP_LINE!"=="!EXPECTED!" (
            echo [T10] FAIL: native child SCRIPT_PATH mismatch
            echo   expected: !EXPECTED!
            echo   actual:   !SP_LINE!
            exit /b 1
          )

          :: NOTE: avoid an unescaped "->" in the PASS line; CMD treats ">" as
          :: redirection, which would swallow the rest of the echo.
          echo [T10] PASS WOW64-to-Sysnative outermost-exit=31 native-relaunch-logged SCRIPT_PATH-ok
          exit /b 0

      - name: Upload wow64-relaunch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow64-relaunch-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/office-deploy-tests/**
          if-no-files-found: warn
          retention-days: 7
