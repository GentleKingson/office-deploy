name: Windows Runtime CI

# Runtime validation of the officeDeploy.bat control flow on real
# GitHub-hosted Windows cmd.exe. This is a safety / contract test:
#   - no ODT download
#   - no Office installation
#   - no activation
# It deliberately exercises only the unattended control-flow paths of
# officeDeploy.bat. T9 / T10 are terminated deterministically inside
# :ensure_odt before any network call by using the script's own
# stale-temporary-cleanup branch as a fault-injection point.
# T12 is the only test that enters the interactive option [2] path. It
# instruments a COPIED bat at runtime (there is NO test seam in the
# production script) so the Ohook call becomes unreachable, then drives the
# read-only :oh_check_supported_office detector against mocked registry +
# marker-file + ClickToRun service fixtures. No activation ever runs.
# T13 drives :oh_activate_core directly (no Office on the runner) to prove
# the fail-fast guard aborts before the mutating cleanup routines.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No path filtering: this workflow is expected to become a required
# check, and path/branch filters on a required workflow can leave it
# stuck Pending. Letting it always run keeps the cost tiny.
permissions:
  contents: read

concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: Runtime contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ----------------------------------------------------------------------
      # T1 / T2 / T3 share the same isolated case directory and only differ
      # by arguments + expected exit code, so a single cmd step runs them.
      # ----------------------------------------------------------------------
      - name: T1 Help / T2 Unknown arg / T3 illegal config-only
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\cli" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\cli\officeDeploy.bat" >nul

          :: Per-case TEMP/TMP isolation so logs cannot collide.
          mkdir "%ROOT%\cli\temp" >nul 2>nul
          set "TEMP=%ROOT%\cli\temp"
          set "TMP=%ROOT%\cli\temp"

          :: ---- T1: --help must exit 0 ----
          call "%ROOT%\cli\officeDeploy.bat" --help > "%ROOT%\cli\t1.out" 2>&1
          set "RC1=!ERRORLEVEL!"
          if not "!RC1!"=="0" (
            echo [T1] FAIL: expected exit 0, got !RC1!
            type "%ROOT%\cli\t1.out"
            exit /b 1
          )
          findstr /c:"officeDeploy.bat --unattended" "%ROOT%\cli\t1.out" >nul || ( echo [T1] FAIL: usage missing --unattended & exit /b 1 )
          findstr /c:"officeDeploy.bat --unattended --config-only" "%ROOT%\cli\t1.out" >nul || ( echo [T1] FAIL: usage missing --config-only & exit /b 1 )
          findstr /c:"officeDeploy.bat --help" "%ROOT%\cli\t1.out" >nul || ( echo [T1] FAIL: usage missing --help & exit /b 1 )
          if exist "%ROOT%\cli\Configuration.xml" ( echo [T1] FAIL: Configuration.xml leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe" ( echo [T1] FAIL: setup.exe leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe.download.tmp" ( echo [T1] FAIL: tmp leaked & exit /b 1 )
          echo [T1] PASS help-exit=0

          :: ---- T2: --unknown must exit 2 ----
          call "%ROOT%\cli\officeDeploy.bat" --unknown > "%ROOT%\cli\t2.out" 2>&1
          set "RC2=!ERRORLEVEL!"
          if not "!RC2!"=="2" ( echo [T2] FAIL: expected 2, got !RC2! & exit /b 1 )
          if exist "%ROOT%\cli\Configuration.xml" ( echo [T2] FAIL: Configuration.xml leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe" ( echo [T2] FAIL: setup.exe leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe.download.tmp" ( echo [T2] FAIL: tmp leaked & exit /b 1 )
          echo [T2] PASS unknown-exit=2

          :: ---- T3: --config-only alone must exit 2 ----
          call "%ROOT%\cli\officeDeploy.bat" --config-only > "%ROOT%\cli\t3.out" 2>&1
          set "RC3=!ERRORLEVEL!"
          if not "!RC3!"=="2" ( echo [T3] FAIL: expected 2, got !RC3! & exit /b 1 )
          if exist "%ROOT%\cli\Configuration.xml" ( echo [T3] FAIL: Configuration.xml leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe" ( echo [T3] FAIL: setup.exe leaked & exit /b 1 )
          if exist "%ROOT%\cli\setup.exe.download.tmp" ( echo [T3] FAIL: tmp leaked & exit /b 1 )
          echo [T3] PASS config-only-alone-exit=2

          exit /b 0

      # ----------------------------------------------------------------------
      # T4 / T4b / T6: real --unattended --config-only must exit 0, produce a
      # non-empty Configuration.xml, leave no setup.exe / tmp, and write an
      # unattended log with the required key markers. T4b re-runs the same
      # case with arguments in reverse order to exercise two consecutive
      # shift /1 in :parse_args and confirm the loop-style parser is order
      # independent. T6 also pins the %0 root-cause fix (SCRIPT_PATH reads
      # %~f0 directly and must not be corrupted).
      # ----------------------------------------------------------------------
      - name: T4 T4b config-only / T6 unattended log
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\config-only" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\config-only\officeDeploy.bat" >nul
          mkdir "%ROOT%\config-only\temp" >nul 2>nul
          set "TEMP=%ROOT%\config-only\temp"
          set "TMP=%ROOT%\config-only\temp"

          call "%ROOT%\config-only\officeDeploy.bat" --unattended --config-only > "%ROOT%\config-only\run.out" 2>&1
          set "RC=!ERRORLEVEL!"

          if not "!RC!"=="0" ( echo [T4] FAIL: expected 0, got !RC! & exit /b 1 )
          if not exist "%ROOT%\config-only\Configuration.xml" ( echo [T4] FAIL: Configuration.xml missing & exit /b 1 )
          for %%A in ("%ROOT%\config-only\Configuration.xml") do set "SZ=%%~zA"
          if !SZ! LEQ 0 ( echo [T4] FAIL: Configuration.xml empty & exit /b 1 )
          if exist "%ROOT%\config-only\setup.exe" ( echo [T4] FAIL: setup.exe should not exist in config-only & exit /b 1 )
          if exist "%ROOT%\config-only\setup.exe.download.tmp" ( echo [T4] FAIL: tmp should not exist in config-only & exit /b 1 )
          echo [T4] PASS config-only-exit=0 xml-size=!SZ!

          :: ---- T4b: reverse argument order (--config-only --unattended) ----
          :: The loop-style parser should accept arguments in any order. This
          :: exercises two consecutive shift /1 and proves %0 is preserved
          :: across both. Uses a fresh temp so the log is unambiguous.
          mkdir "%ROOT%\config-only-rev" >nul 2>nul
          mkdir "%ROOT%\config-only-rev\temp" >nul 2>nul
          set "TEMP=%ROOT%\config-only-rev\temp"
          set "TMP=%ROOT%\config-only-rev\temp"
          :: Re-copy the bat so Configuration.xml lands in the rev case dir.
          copy /y "officeDeploy.bat" "%ROOT%\config-only-rev\officeDeploy.bat" >nul
          call "%ROOT%\config-only-rev\officeDeploy.bat" --config-only --unattended > "%ROOT%\config-only-rev\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T4b] FAIL: expected 0, got !RC! & exit /b 1 )
          if not exist "%ROOT%\config-only-rev\Configuration.xml" ( echo [T4b] FAIL: Configuration.xml missing & exit /b 1 )
          for %%A in ("%ROOT%\config-only-rev\Configuration.xml") do set "SZ=%%~zA"
          if !SZ! LEQ 0 ( echo [T4b] FAIL: Configuration.xml empty & exit /b 1 )
          :: Display Level must be None (unattended mode was detected). Avoid
          :: embedding literal quotes in findstr /c (CMD ends the string at "),
          :: so search for the unambiguous quote-free substrings instead.
          findstr /c:"Level=" "%ROOT%\config-only-rev\Configuration.xml" >nul || ( echo [T4b] FAIL: no Display Level & exit /b 1 )
          findstr /c:"None" "%ROOT%\config-only-rev\Configuration.xml" >nul || ( echo [T4b] FAIL: Display Level not None & exit /b 1 )
          if exist "%ROOT%\config-only-rev\setup.exe" ( echo [T4b] FAIL: setup.exe should not exist & exit /b 1 )
          echo [T4b] PASS config-only-reverse-order-exit=0
          :: Restore the forward-order temp for T6's log assertions below.
          set "TEMP=%ROOT%\config-only\temp"
          set "TMP=%ROOT%\config-only\temp"

          :: ---- T6: log must exist and carry the contract markers ----
          :: SCRIPT_PATH now reads %~f0 directly (root-cause fix), so this
          :: step is a true bare-shift root-cause regression: if shift is
          :: ever changed back to bare shift, %~f0 corrupts and T6 fails.
          if not exist "%TEMP%\office-deploy\office-deploy.log" ( echo [T6] FAIL: log missing & exit /b 1 )
          set "LOG=%TEMP%\office-deploy\office-deploy.log"
          findstr /c:"MODE=UNATTENDED" "%LOG%" >nul || ( echo [T6] FAIL: no MODE=UNATTENDED & exit /b 1 )
          findstr /c:"CONFIG_ONLY=1" "%LOG%" >nul || ( echo [T6] FAIL: no CONFIG_ONLY=1 & exit /b 1 )
          findstr /c:"ADMIN_CHECK=SKIPPED" "%LOG%" >nul || ( echo [T6] FAIL: no ADMIN_CHECK=SKIPPED & exit /b 1 )
          findstr /c:"RESULT=SUCCESS" "%LOG%" >nul || ( echo [T6] FAIL: no RESULT=SUCCESS & exit /b 1 )
          findstr /c:"EXIT_CODE=0" "%LOG%" >nul || ( echo [T6] FAIL: no EXIT_CODE=0 & exit /b 1 )

          :: Root-cause regression: SCRIPT_PATH (now %~f0) must EQUAL the
          :: BAT path exactly. If anyone reverts shift /1 to bare shift, %~f0
          :: corrupts (becomes CWD + last shifted arg) and this precise match
          :: fails -- it will not be masked by _self staying correct. Use
          :: case-insensitive compare to tolerate drive-letter/case variance.
          set "SP_LINE="
          for /f "usebackq tokens=1,* delims==" %%A in ("%LOG%") do (
            if "%%A"=="[office-deploy] SCRIPT_PATH" set "SP_LINE=%%B"
          )
          if not defined SP_LINE ( echo [T6] FAIL: SCRIPT_PATH line absent & exit /b 1 )
          set "EXPECTED=%ROOT%\config-only\officeDeploy.bat"
          if /i not "!SP_LINE!"=="!EXPECTED!" (
            echo [T6] FAIL: SCRIPT_PATH mismatch
            echo   expected: !EXPECTED!
            echo   actual:   !SP_LINE!
            exit /b 1
          )
          echo [T6] PASS log-markers-ok SCRIPT_PATH=!SP_LINE!

          exit /b 0

      # ----------------------------------------------------------------------
      # T5: validate the Configuration.xml that the BAT actually generated
      # at runtime (not a static echo reconstruction).
      # ----------------------------------------------------------------------
      - name: T5 Validate generated XML
        shell: pwsh
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP 'office-deploy-tests\config-only\Configuration.xml'
          if (-not (Test-Path -LiteralPath $cfg)) { throw "Configuration.xml not found at $cfg" }
          [xml]$xml = Get-Content -LiteralPath $cfg -Raw

          function Assert-True($cond, $msg) {
            if (-not $cond) { throw "ASSERT FAILED: $msg" }
          }

          $add = $xml.Configuration.Add
          Assert-True ($add.OfficeClientEdition -eq '64') "OfficeClientEdition=64"
          Assert-True ($add.Channel -eq 'MonthlyEnterprise') "Channel=MonthlyEnterprise"

          $prod = $add.Product
          Assert-True ($prod.ID -eq 'O365ProPlusRetail') "Product ID=O365ProPlusRetail"

          Assert-True ($prod.Language.ID -eq 'zh-cn') "Language ID=zh-cn"

          $disp = $xml.Configuration.Display
          Assert-True ($disp.Level -eq 'None') "Display Level=None"
          Assert-True ($disp.AcceptEULA -eq 'TRUE') "AcceptEULA=TRUE"

          $upd = $xml.Configuration.Updates
          Assert-True ($upd.Enabled -eq 'FALSE') "Updates Enabled=FALSE"

          Assert-True ($null -ne $xml.Configuration.RemoveMSI) "RemoveMSI present"

          $excludes = @()
          foreach ($e in $prod.ExcludeApp) { $excludes += $e.ID }
          foreach ($expected in 'Groove','Lync','OneDrive','OutlookForWindows','Teams') {
            Assert-True ($excludes -contains $expected) "ExcludeApp contains $expected"
          }

          Write-Host "[T5] PASS generated-xml valid; excludes=$($excludes -join ',')"

      # ----------------------------------------------------------------------
      # T7: working-directory independence. The BAT sits in dir A, we run
      # it from dir B, and Configuration.xml must land in A (%~dp0).
      # ----------------------------------------------------------------------
      - name: T7 Working directory independence
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\working-dir\bat" >nul 2>nul
          mkdir "%ROOT%\working-dir\cwd" >nul 2>nul
          mkdir "%ROOT%\working-dir\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\working-dir\bat\officeDeploy.bat" >nul

          set "TEMP=%ROOT%\working-dir\temp"
          set "TMP=%ROOT%\working-dir\temp"

          pushd "%ROOT%\working-dir\cwd"
          call "%ROOT%\working-dir\bat\officeDeploy.bat" --unattended --config-only > "%ROOT%\working-dir\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          popd

          if not "!RC!"=="0" ( echo [T7] FAIL: expected 0, got !RC! & exit /b 1 )
          if not exist "%ROOT%\working-dir\bat\Configuration.xml" ( echo [T7] FAIL: xml not in script dir & exit /b 1 )
          if exist "%ROOT%\working-dir\cwd\Configuration.xml" ( echo [T7] FAIL: xml leaked into cwd & exit /b 1 )
          echo [T7] PASS script-relative-config-ok
          exit /b 0

      # ----------------------------------------------------------------------
      # T8: path with spaces. Exercises %~f0 / %~dp0 / _cfg / _setup
      # quoting against a script directory that itself contains spaces.
      # ----------------------------------------------------------------------
      - name: T8 Path with spaces
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\Office Deploy Runtime"
          mkdir "%ROOT%\Case With Spaces" >nul 2>nul
          mkdir "%ROOT%\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\Case With Spaces\officeDeploy.bat" >nul

          set "TEMP=%ROOT%\temp"
          set "TMP=%ROOT%\temp"

          pushd "%RUNNER_TEMP%"
          call "%ROOT%\Case With Spaces\officeDeploy.bat" --unattended --config-only > "%ROOT%\run.out" 2>&1
          set "RC=!ERRORLEVEL!"
          popd

          if not "!RC!"=="0" ( echo [T8] FAIL: expected 0, got !RC! & exit /b 1 )
          if not exist "%ROOT%\Case With Spaces\Configuration.xml" ( echo [T8] FAIL: xml not in spaced script dir & exit /b 1 )
          echo [T8] PASS path-with-spaces-ok
          exit /b 0

      # ----------------------------------------------------------------------
      # T9: invalid cached setup.exe recovery. Fault injection:
      #   fake setup.exe (plain text)      -> Authenticode invalid
      #   setup.exe.download.tmp (DIR)     -> del cannot remove a directory
      # Control flow: validate fails -> cache removed -> stale temp present
      # -> del fails -> STALE_TEMP_REMOVE_FAILED -> exit 31.
      # This terminates inside :ensure_odt BEFORE the Invoke-WebRequest line,
      # so no ODT network download and no Office install can occur.
      # ----------------------------------------------------------------------
      - name: T9 Invalid cached setup.exe recovery
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\cache-recovery" >nul 2>nul
          mkdir "%ROOT%\cache-recovery\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\cache-recovery\officeDeploy.bat" >nul

          :: Fake cached setup.exe: plain text, never a valid Authenticode PE.
          echo this-is-not-a-valid-odt-setup-exe > "%ROOT%\cache-recovery\setup.exe"
          :: Stale temp download as a DIRECTORY: "del /f /q" cannot delete it,
          :: which deterministically drives the stale-temp-remove-failed branch.
          mkdir "%ROOT%\cache-recovery\setup.exe.download.tmp" >nul

          set "TEMP=%ROOT%\cache-recovery\temp"
          set "TMP=%ROOT%\cache-recovery\temp"

          call "%ROOT%\cache-recovery\officeDeploy.bat" --unattended > "%ROOT%\cache-recovery\run.out" 2>&1
          set "RC=!ERRORLEVEL!"

          :: Stable exit code must be 31 (and not 10/30/50/60).
          if not "!RC!"=="31" (
            echo [T9] FAIL: expected exit 31, got !RC!
            type "%ROOT%\cache-recovery\run.out"
            exit /b 1
          )

          :: Invalid cached final must have been removed during recovery.
          if exist "%ROOT%\cache-recovery\setup.exe" (
            echo [T9] FAIL: fake setup.exe should have been removed
            exit /b 1
          )
          :: Stale temp directory must still exist (del cannot remove a dir).
          if not exist "%ROOT%\cache-recovery\setup.exe.download.tmp\" (
            echo [T9] FAIL: stale temp dir unexpectedly removed
            exit /b 1
          )

          :: Guard: the recovery must NOT have reached a real download.
          findstr /c:"Downloading setup.exe from Microsoft CDN" "%ROOT%\cache-recovery\run.out" >nul && (
            echo [T9] FAIL: reached ODT network download - fault injection broken
            exit /b 1
          )
          :: Guard: must NOT have reached the Office install stage.
          findstr /c:"STAGE=INSTALL" "%ROOT%\cache-recovery\run.out" >nul && (
            echo [T9] FAIL: reached Office install stage
            exit /b 1
          )

          :: Required log markers (unattended log lives under isolated TEMP).
          set "LOG=%TEMP%\office-deploy\office-deploy.log"
          if not exist "%LOG%" ( echo [T9] FAIL: log missing & exit /b 1 )
          findstr /c:"ODT_CACHE_VALID=FALSE" "%LOG%" >nul || ( echo [T9] FAIL: no ODT_CACHE_VALID=FALSE & exit /b 1 )
          findstr /c:"ODT_RECOVERY=INVALID_CACHE_REMOVED" "%LOG%" >nul || ( echo [T9] FAIL: no INVALID_CACHE_REMOVED & exit /b 1 )
          findstr /c:"ODT_RECOVERY=STALE_TEMP_REMOVE_FAILED" "%LOG%" >nul || ( echo [T9] FAIL: no STALE_TEMP_REMOVE_FAILED & exit /b 1 )
          findstr /c:"RESULT=FAILED" "%LOG%" >nul || ( echo [T9] FAIL: no RESULT=FAILED & exit /b 1 )
          findstr /c:"EXIT_CODE=31" "%LOG%" >nul || ( echo [T9] FAIL: no EXIT_CODE=31 & exit /b 1 )

          echo [T9] PASS invalid-cache-recovery-exit=31 no-network no-install
          exit /b 0

      # ----------------------------------------------------------------------
      # T11: interactive menu runtime verification. This is the only test that
      # exercises the interactive menu. It pipes "3" to choose Exit, so the
      # menu is rendered, the Exit branch is taken, and NO installation or
      # activation path is entered. This deliberately never sends "2", so no
      # activation logic is executed in CI.
      # ----------------------------------------------------------------------
      - name: T11 Interactive menu
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\interactive" >nul 2>nul
          mkdir "%ROOT%\interactive\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\interactive\officeDeploy.bat" >nul

          set "TEMP=%ROOT%\interactive\temp"
          set "TMP=%ROOT%\interactive\temp"

          :: choice /c 123 reads the first key and returns; the trailing CR/LF
          :: from echo is then consumed by the interactive "pause" at :finish.
          echo 3| call "%ROOT%\interactive\officeDeploy.bat" > "%ROOT%\interactive\run.out" 2>&1
          set "RC=!ERRORLEVEL!"

          :: Exit mapping for option [3] must be exit 0.
          if not "!RC!"=="0" ( echo [T11] FAIL: expected exit 0, got !RC! & type "%ROOT%\interactive\run.out" & exit /b 1 )

          :: The three menu options must be rendered exactly.
          findstr /c:"[1] Install Microsoft 365 Apps for enterprise" "%ROOT%\interactive\run.out" >nul || ( echo [T11] FAIL: option [1] missing & exit /b 1 )
          findstr /c:"[2] Activate installed Office" "%ROOT%\interactive\run.out" >nul || ( echo [T11] FAIL: option [2] missing & exit /b 1 )
          findstr /c:"[3] Exit" "%ROOT%\interactive\run.out" >nul || ( echo [T11] FAIL: option [3] missing & exit /b 1 )

          :: Neutral header title is now rendered.
          findstr /c:"Microsoft Office Deployment Utility" "%ROOT%\interactive\run.out" >nul || ( echo [T11] FAIL: neutral title missing & exit /b 1 )

          :: Guards: choosing Exit must NOT reach the install/activate paths.
          if exist "%ROOT%\interactive\Configuration.xml" ( echo [T11] FAIL: Configuration.xml leaked & exit /b 1 )
          if exist "%ROOT%\interactive\setup.exe" ( echo [T11] FAIL: setup.exe leaked & exit /b 1 )
          if exist "%ROOT%\interactive\setup.exe.download.tmp" ( echo [T11] FAIL: tmp leaked & exit /b 1 )
          findstr /c:"STAGE=INSTALL" "%ROOT%\interactive\run.out" >nul && ( echo [T11] FAIL: reached Office install stage & exit /b 1 )
          findstr /c:"Checking for an installed Microsoft Office" "%ROOT%\interactive\run.out" >nul && ( echo [T11] FAIL: reached activation path & exit /b 1 )

          :: Static structural assertion: option [2] dispatches to the new
          :: activate-installed-Office entry, and that entry label exists.
          findstr /c:"goto activate_existing" "%ROOT%\interactive\officeDeploy.bat" >nul || ( echo [T11] FAIL: menu does not dispatch to activate_existing & exit /b 1 )
          findstr /b /c:":activate_existing" "%ROOT%\interactive\officeDeploy.bat" >nul || ( echo [T11] FAIL: :activate_existing label missing & exit /b 1 )

          echo [T11] PASS interactive-menu-rendered exit-mapping=0 no-install no-activation
          exit /b 0

      # ----------------------------------------------------------------------
      # T12: option [2] "Activate installed Office" detection control flow.
      # The only test that executes option [2]. It drives the real MAS-derived
      # :oh_check_supported_office detector (:oh_getpath registry+marker file,
      # PLUS the upstream ClickToRun service validity check) against mocked
      # fixtures, then stops BEFORE :oh_activate_core, so no Ohook activation
      # or licensing mutation ever runs in CI.
      #
      # IMPORTANT: there is NO test seam in production officeDeploy.bat. CI
      # instruments the COPIED test bat at runtime, inserting a `goto finish`
      # right after the "detected" echo inside :activate_existing so the Ohook
      # call becomes unreachable. Production code is never test-gated.
      #   A: 64-bit Click-to-Run (registry + marker + service present)  PASS
      #   B: 32-bit MSI           (Wow6432Node + *Picker.dll)            PASS
      #   C: registry present but NO marker file         -> REJECTED (70)
      #   D: registry + marker but NO ClickToRun service -> REJECTED (70)
      # Also guards the Wow6432Node spelling so the 32-bit regression cannot
      # silently return.
      # ----------------------------------------------------------------------
      - name: T12 option [2] detection (read-only, mocked registry + marker + service)
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\activate-detect" >nul 2>nul
          mkdir "%ROOT%\activate-detect\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\activate-detect\officeDeploy.bat" >nul
          set "TEMP=%ROOT%\activate-detect\temp"
          set "TMP=%ROOT%\activate-detect\temp"

          :: Instrument the COPY (never the checked-in bat): insert a
          :: `goto finish` immediately after the unique "detected" echo in
          :activate_existing so :oh_activate_core becomes unreachable in CI.
          :: Anchor is unique to :activate_existing (the [1] post-install path
          :: has no such line). Uses a backtick-n newline in PowerShell.
          powershell -NoProfile -Command "$f='%ROOT%\activate-detect\officeDeploy.bat'; $a='echo Microsoft Office detected. Proceeding with Ohook activation.'; $t=Get-Content -LiteralPath $f -Raw; if($t -notlike ('*'+$a+'*')){exit 1}; $t=$t -replace [regex]::Escape($a), ($a+\"`r`ngoto finish\"); Set-Content -LiteralPath $f -Value $t -NoNewline; exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T12] FAIL: instrumentation anchor not found & exit /b 1 )

          :: Static guard: production bat must NOT carry any test seam.
          findstr /c:"OFFICE_DEPLOY_TEST_DETECT_ONLY" "officeDeploy.bat" >nul && ( echo [T12] FAIL: test seam present in production bat & exit /b 1 )

          :: Helper: wipe every Office detection key + fixture dir between
          :: scenarios so a leftover cannot satisfy a later scenario.
          :: :oh_getpath reads these keys (C2R InstallPath / MSI InstallRoot
          :: Path) and then requires a marker FILE under the install path;
          :: :oh_check_supported_office additionally requires ClickToRunSvc.
          set "CLEAN_KEYS=HKLM\SOFTWARE\Microsoft\Office\ClickToRun HKLM\SOFTWARE\Microsoft\Office\15.0\ClickToRun HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\16.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\16.0\Common\InstallRoot HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\15.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\15.0\Common\InstallRoot HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\14.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\14.0\Common\InstallRoot"
          rmdir /s /q "C:\Fix16" >nul 2>nul
          rmdir /s /q "C:\Fix16x86" >nul 2>nul
          rmdir /s /q "C:\NoMarker" >nul 2>nul
          rmdir /s /q "C:\NoSvc" >nul 2>nul
          :: Remove any leftover test services from prior runs, best-effort.
          sc delete ClickToRunSvc >nul 2>nul
          sc delete OfficeSvc >nul 2>nul

          :: ---- Scenario A: 64-bit C2R + marker + service present ----
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          :: :oh_getpath reads ClickToRun\InstallPath, then checks
          :: <InstallPath>\root\Licenses16\ProPlus*.xrm-ms.
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f /v InstallPath /t REG_SZ /d "C:\Fix16" >nul || ( echo [T12a] FAIL: reg add InstallPath & exit /b 1 )
          mkdir "C:\Fix16\root\Licenses16" >nul 2>nul
          echo dummy-license > "C:\Fix16\root\Licenses16\ProPlusDummy.xrm-ms"
          :: Create a dummy ClickToRunSvc so sc query returns 0 (present).
          :: `binPath` must be quoted; sc create rejects a missing binary but
          :: still registers the service name, which is all sc query checks.
          sc create ClickToRunSvc binPath= "%SystemRoot%\system32\cmd.exe" >nul || ( echo [T12a] FAIL: sc create ClickToRunSvc & exit /b 1 )

          echo 2| call "%ROOT%\activate-detect\officeDeploy.bat" > "%ROOT%\activate-detect\a.out" 2>&1
          set "RC=!ERRORLEVEL!"
          sc delete ClickToRunSvc >nul 2>nul
          if not "!RC!"=="0" ( echo [T12a] FAIL: expected exit 0, got !RC! & type "%ROOT%\activate-detect\a.out" & exit /b 1 )
          findstr /c:"Microsoft Office detected" "%ROOT%\activate-detect\a.out" >nul || ( echo [T12a] FAIL: not detected & type "%ROOT%\activate-detect\a.out" & exit /b 1 )
          findstr /c:"Activating your Office" "%ROOT%\activate-detect\a.out" >nul && ( echo [T12a] FAIL: reached Ohook activation & exit /b 1 )
          findstr /c:"No supported Microsoft Office" "%ROOT%\activate-detect\a.out" >nul && ( echo [T12a] FAIL: falsely rejected & exit /b 1 )
          echo [T12a] PASS clicktorun-x64 registry+marker+service detected no-ohook

          :: ---- Scenario B: 32-bit MSI (Wow6432Node) + marker file ----
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          :: MSI installs are not gated on ClickToRunSvc, so no service here.
          :: :oh_getpath reads 16.0\Common\InstallRoot\Path, then checks
          :: <Path>\*Picker.dll.
          reg add "HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\16.0\Common\InstallRoot" /f /v Path /t REG_SZ /d "C:\Fix16x86" >nul || ( echo [T12b] FAIL: reg add MSI root & exit /b 1 )
          mkdir "C:\Fix16x86" >nul 2>nul
          echo dummy-picker > "C:\Fix16x86\DummyPicker.dll"

          echo 2| call "%ROOT%\activate-detect\officeDeploy.bat" > "%ROOT%\activate-detect\b.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="0" ( echo [T12b] FAIL: expected exit 0, got !RC! & type "%ROOT%\activate-detect\b.out" & exit /b 1 )
          findstr /c:"Microsoft Office detected" "%ROOT%\activate-detect\b.out" >nul || ( echo [T12b] FAIL: not detected & type "%ROOT%\activate-detect\b.out" & exit /b 1 )
          findstr /c:"Activating your Office" "%ROOT%\activate-detect\b.out" >nul && ( echo [T12b] FAIL: reached Ohook activation & exit /b 1 )
          findstr /c:"No supported Microsoft Office" "%ROOT%\activate-detect\b.out" >nul && ( echo [T12b] FAIL: falsely rejected & exit /b 1 )
          echo [T12b] PASS msi-x86-wow6432node registry+marker detected no-ohook

          :: ---- Scenario C: registry present, marker file ABSENT -> REJECT ----
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f /v InstallPath /t REG_SZ /d "C:\NoMarker" >nul || ( echo [T12c] FAIL: reg add InstallPath & exit /b 1 )
          :: Deliberately do NOT create C:\NoMarker\root\Licenses16\ProPlus*.xrm-ms.

          echo 2| call "%ROOT%\activate-detect\officeDeploy.bat" > "%ROOT%\activate-detect\c.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="70" ( echo [T12c] FAIL: expected exit 70, got !RC! & type "%ROOT%\activate-detect\c.out" & exit /b 1 )
          findstr /c:"No supported Microsoft Office installation was found." "%ROOT%\activate-detect\c.out" >nul || ( echo [T12c] FAIL: reject message missing & type "%ROOT%\activate-detect\c.out" & exit /b 1 )
          findstr /c:"Microsoft Office detected" "%ROOT%\activate-detect\c.out" >nul && ( echo [T12c] FAIL: falsely detected & exit /b 1 )
          findstr /c:"Activating your Office" "%ROOT%\activate-detect\c.out" >nul && ( echo [T12c] FAIL: reached Ohook activation & exit /b 1 )
          echo [T12c] PASS registry-without-marker rejected exit=70 no-ohook

          :: ---- Scenario D: registry + marker but NO ClickToRun service -> REJECT ----
          for %%K in (!CLEAN_KEYS!) do reg delete "%%K" /f >nul 2>nul
          sc delete ClickToRunSvc >nul 2>nul
          reg add "HKLM\SOFTWARE\Microsoft\Office\ClickToRun" /f /v InstallPath /t REG_SZ /d "C:\NoSvc" >nul || ( echo [T12d] FAIL: reg add InstallPath & exit /b 1 )
          mkdir "C:\NoSvc\root\Licenses16" >nul 2>nul
          echo dummy-license > "C:\NoSvc\root\Licenses16\ProPlusDummy.xrm-ms"
          :: Deliberately do NOT create ClickToRunSvc; sc query -> 1060.

          echo 2| call "%ROOT%\activate-detect\officeDeploy.bat" > "%ROOT%\activate-detect\d.out" 2>&1
          set "RC=!ERRORLEVEL!"
          if not "!RC!"=="70" ( echo [T12d] FAIL: expected exit 70, got !RC! & type "%ROOT%\activate-detect\d.out" & exit /b 1 )
          findstr /c:"No supported Microsoft Office installation was found." "%ROOT%\activate-detect\d.out" >nul || ( echo [T12d] FAIL: reject message missing & type "%ROOT%\activate-detect\d.out" & exit /b 1 )
          findstr /c:"Not found, Office 16.0 files found" "%ROOT%\activate-detect\d.out" >nul || ( echo [T12d] FAIL: service-check message missing & type "%ROOT%\activate-detect\d.out" & exit /b 1 )
          findstr /c:"Microsoft Office detected" "%ROOT%\activate-detect\d.out" >nul && ( echo [T12d] FAIL: falsely detected despite missing service & exit /b 1 )
          findstr /c:"Activating your Office" "%ROOT%\activate-detect\d.out" >nul && ( echo [T12d] FAIL: reached Ohook activation & exit /b 1 )
          echo [T12d] PASS registry+marker-without-service rejected exit=70 no-ohook

          :: ---- Static guards: Wow6432Node spelling must not regress ----
          findstr /c:"WOW64Node\Microsoft" "%ROOT%\activate-detect\officeDeploy.bat" >nul && ( echo [T12] FAIL: WOW64Node typo present & exit /b 1 )
          findstr /c:"Wow6432Node\Microsoft" "%ROOT%\activate-detect\officeDeploy.bat" >nul || ( echo [T12] FAIL: Wow6432Node key missing & exit /b 1 )
          echo [T12] PASS wow6432node-spelling-guard

          exit /b 0

      # ----------------------------------------------------------------------
      # T13: :oh_activate_core fail-fast regression. The most important new
      # defense-in-depth guard: when NO supported Office is present, core must
      # abort BEFORE the per-product routines and BEFORE the unconditional
      # :oh_clearblock / :oh_uninstkey / :oh_licrefresh cleanup (which mutate
      # license state). T12 stops before core, so this drives core directly.
      # It instruments the test COPY with a RUN_CORE dispatcher (never the
      # production bat) and, with no Office on the runner, asserts core exits
      # non-zero without ever reaching the cleanup markers.
      # ----------------------------------------------------------------------
      - name: T13 oh_activate_core fail-fast (no Office)
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\core-failfast" >nul 2>nul
          mkdir "%ROOT%\core-failfast\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\core-failfast\officeDeploy.bat" >nul
          set "TEMP=%ROOT%\core-failfast\temp"
          set "TMP=%ROOT%\core-failfast\temp"

          :: Ensure the runner has no supported Office keys/services so the
          :: shared :oh_check_supported_office clears every o* flag.
          for %%K in (HKLM\SOFTWARE\Microsoft\Office\ClickToRun HKLM\SOFTWARE\Microsoft\Office\15.0\ClickToRun HKLM\SOFTWARE\Wow6432Node\Microsoft\Office\16.0\Common\InstallRoot HKLM\SOFTWARE\Microsoft\Office\16.0\Common\InstallRoot) do reg delete "%%K" /f >nul 2>nul

          :: Instrument the COPY: replace the first line (@set masver=3.10)
          :: with a RUN_CORE dispatcher + that same line. Uses the SAME
          :: proven PowerShell -replace pattern as T12 (double-quoted
          :: replacement string so `r`n becomes real CRLF). The dispatcher
          :: avoids cmd-expanded tokens: it checks _T13_RUN_CORE (set by the
          :: caller below) instead of %1, and uses goto :eof to propagate
          :: the called label's errorlevel. Anchored on @set masver=3.10
          :: (the unique first line) so the replacement is exact.
          powershell -NoProfile -Command "$f='%ROOT%\core-failfast\officeDeploy.bat'; $t=[IO.File]::ReadAllText($f); $old=\"@set masver=3.10\"; $new=\"@echo off`r`nsetlocal EnableExtensions EnableDelayedExpansion`r`nif defined _T13_RUN_CORE ( call :oh_activate_core ^& goto :eof )`r`n@set masver=3.10\"; if(-not $t.StartsWith($old)){exit 1}; $t=$new + $t.Substring($old.Length); [IO.File]::WriteAllText($f,$t); exit 0"
          if !ERRORLEVEL! NEQ 0 ( echo [T13] FAIL: dispatcher injection failed & exit /b 1 )

          :: Drive core with _T13_RUN_CORE set.
          set "_T13_RUN_CORE=1"
          call "%ROOT%\core-failfast\officeDeploy.bat" > "%ROOT%\core-failfast\out.txt" 2>&1
          set "RC=!ERRORLEVEL!"
          set "_T13_RUN_CORE="

          :: Core must return non-zero (exit /b 1 from the fail-fast).
          if "!RC!"=="0" ( echo [T13] FAIL: expected non-zero, got 0 & type "%ROOT%\core-failfast\out.txt" & exit /b 1 )
          :: Must print the no-Office abort line.
          findstr /c:"No supported Microsoft Office was found to activate." "%ROOT%\core-failfast\out.txt" >nul || ( echo [T13] FAIL: abort line missing & type "%ROOT%\core-failfast\out.txt" & exit /b 1 )
          :: Must NOT reach the mutating cleanup routines. These are their
          :: distinctive success echoes (only printed if the routine runs).
          findstr /c:"Clearing Office License Blocks" "%ROOT%\core-failfast\out.txt" >nul && ( echo [T13] FAIL: reached oh_clearblock & type "%ROOT%\core-failfast\out.txt" & exit /b 1 )
          findstr /c:"Uninstalling Other/Grace Keys" "%ROOT%\core-failfast\out.txt" >nul && ( echo [T13] FAIL: reached oh_uninstkey & type "%ROOT%\core-failfast\out.txt" & exit /b 1 )
          :: Must NOT proceed into per-product activation echoes.
          findstr /c:"Activating Office..." "%ROOT%\core-failfast\out.txt" >nul && ( echo [T13] FAIL: reached per-product activation & type "%ROOT%\core-failfast\out.txt" & exit /b 1 )
          echo [T13] PASS core-failfast no-office abort-before-cleanup rc=!RC!

          exit /b 0

      - name: Upload runtime-contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contract-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/office-deploy-tests/**
            ${{ runner.temp }}/Office Deploy Runtime/**
          if-no-files-found: warn
          retention-days: 7

  wow64-relaunch:
    name: WOW64 -> Sysnative (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ----------------------------------------------------------------------
      # T10: launch officeDeploy.bat from a real 32-bit CMD
      # (%SystemRoot%\SysWOW64\cmd.exe) on the x64 runner, force the
      # Sysnative native relaunch, and verify the native child exit code
      # propagates to the outermost ERRORLEVEL reported to our wrapper.
      # Same fixture as T9, so the native child also exits 31.
      # ----------------------------------------------------------------------
      - name: T10 WOW64 -> Sysnative relaunch
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          set "ROOT=%RUNNER_TEMP%\office-deploy-tests"
          mkdir "%ROOT%\wow64" >nul 2>nul
          mkdir "%ROOT%\wow64\temp" >nul 2>nul
          copy /y "officeDeploy.bat" "%ROOT%\wow64\officeDeploy.bat" >nul

          :: Same fault-injection fixture as T9.
          echo this-is-not-a-valid-odt-setup-exe > "%ROOT%\wow64\setup.exe"
          mkdir "%ROOT%\wow64\setup.exe.download.tmp" >nul

          set "TEMP=%ROOT%\wow64\temp"
          set "TMP=%ROOT%\wow64\temp"

          :: Sanity: the runner must expose a real 32-bit CMD. (SysWOW64 is
          :: visible from this 64-bit wrapper CMD.) Note we deliberately do
          :: NOT preflight Sysnative here: %SystemRoot%\Sysnative is a virtual
          :: alias only visible to 32-bit (WOW64) processes, so it is absent
          :: from this 64-bit wrapper. officeDeploy.bat checks it from inside
          :: the 32-bit process where it is resolvable; the proof that the
          :: native relaunch actually happened is the NATIVE_RELAUNCH=1 marker
          :: in the native-child log plus the propagated outermost exit code.
          if not exist "%SystemRoot%\SysWOW64\cmd.exe" ( echo [T10] FAIL: SysWOW64\cmd.exe missing & exit /b 1 )

          :: To avoid fragile nested-quote parsing across two layers of cmd,
          :: generate a tiny wrapper bat and let the 32-bit CMD run it. The
          :: wrapper path is space-free, so "cmd /c wrapper" quoting is trivial.
          > "%ROOT%\wow64\inner.cmd" echo @echo off
          >> "%ROOT%\wow64\inner.cmd" echo call "%ROOT%\wow64\officeDeploy.bat" --unattended ^> "%ROOT%\wow64\run.out" 2^>^&1

          :: Launch from a genuine 32-bit CMD. The script detects Sysnative
          :: and relaunches itself natively; the native child exits 31 and
          :: that must propagate to the outermost level we observe here.
          "%SystemRoot%\SysWOW64\cmd.exe" /d /c "%ROOT%\wow64\inner.cmd"
          set "RC=!ERRORLEVEL!"

          if not "!RC!"=="31" (
            echo [T10] FAIL: expected outermost exit 31, got !RC!
            type "%ROOT%\wow64\run.out"
            exit /b 1
          )

          :: Guard: no real ODT download and no Office install reached.
          findstr /c:"Downloading setup.exe from Microsoft CDN" "%ROOT%\wow64\run.out" >nul && (
            echo [T10] FAIL: reached ODT network download
            exit /b 1
          )
          findstr /c:"STAGE=INSTALL" "%ROOT%\wow64\run.out" >nul && (
            echo [T10] FAIL: reached Office install stage
            exit /b 1
          )

          :: The final unattended log is written by the native child, so it
          :: must carry NATIVE_RELAUNCH=1 alongside EXIT_CODE=31.
          set "LOG=%TEMP%\office-deploy\office-deploy.log"
          if not exist "%LOG%" ( echo [T10] FAIL: native child log missing & exit /b 1 )
          findstr /c:"NATIVE_RELAUNCH=1" "%LOG%" >nul || ( echo [T10] FAIL: no NATIVE_RELAUNCH=1 in log & exit /b 1 )
          findstr /c:"EXIT_CODE=31" "%LOG%" >nul || ( echo [T10] FAIL: no EXIT_CODE=31 in log & exit /b 1 )

          :: Native child parsed --unattended AND re1 (two shift /1). Assert
          :: its SCRIPT_PATH EQUALS the BAT path exactly. This proves %0
          :: survives multiple shifts in the relaunched child and is the most
          :: precise lock for the bare-shift root cause. Case-insensitive
          :: compare tolerates drive-letter/case variance.
          set "SP_LINE="
          for /f "usebackq tokens=1,* delims==" %%A in ("%LOG%") do (
            if "%%A"=="[office-deploy] SCRIPT_PATH" set "SP_LINE=%%B"
          )
          if not defined SP_LINE ( echo [T10] FAIL: native child SCRIPT_PATH line absent & exit /b 1 )
          set "EXPECTED=%ROOT%\wow64\officeDeploy.bat"
          if /i not "!SP_LINE!"=="!EXPECTED!" (
            echo [T10] FAIL: native child SCRIPT_PATH mismatch
            echo   expected: !EXPECTED!
            echo   actual:   !SP_LINE!
            exit /b 1
          )

          :: NOTE: avoid an unescaped "->" in the PASS line; CMD treats ">" as
          :: redirection, which would swallow the rest of the echo.
          echo [T10] PASS WOW64-to-Sysnative outermost-exit=31 native-relaunch-logged SCRIPT_PATH-ok
          exit /b 0

      - name: Upload wow64-relaunch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow64-relaunch-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/office-deploy-tests/**
          if-no-files-found: warn
          retention-days: 7
